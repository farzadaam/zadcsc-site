<style>
:root{
  --y:#FF8000; --y2:#FF9A33; --ink:#0E0E0E; --ink2:#1A1A1A; --ink3:#262626;
  --line:#2E2E2E; --mut:#A3A3A3; --bg:#F6F5F1; --card:#FFFFFF; --txt:#151515; --sub:#5C5C5C;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Vazirmatn,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(14,14,14,.94);backdrop-filter:blur(10px);color:#fff;border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:18px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:.3px}
.logo .mark{width:38px;height:38px;border-radius:9px;background:#fff;display:grid;place-items:center}
.logo .mark img{height:28px;width:auto;display:block}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--mut);margin-top:-6px}
@media (max-width:600px){.logo small{display:none}.logo{font-size:17px;gap:6px;white-space:nowrap}}@media (max-width:420px){.logo .csc{display:none}}@media (max-width:600px){.logo .mark{width:34px;height:34px}.logo .mark img{height:24px}}
nav.main{display:flex;gap:4px;margin-inline-start:auto}
nav.main a{padding:8px 14px;border-radius:999px;font-weight:500;font-size:15px;color:#ddd}
nav.main a:hover{color:#fff;background:var(--ink3)}
nav.main a.on{background:var(--y);color:var(--ink)}
.hact{display:flex;gap:8px;align-items:center}
.lang{display:flex;background:var(--ink3);border-radius:999px;padding:3px}
.lang button{padding:4px 10px;border-radius:999px;font-size:13px;color:#bbb}
.lang button.on{background:#fff;color:var(--ink)}
.cartbtn{position:relative;width:42px;height:42px;border-radius:50%;background:var(--ink3);display:grid;place-items:center}
.cartbtn svg{width:20px;height:20px}
.cartbtn .n{position:absolute;top:-3px;inset-inline-end:-3px;background:var(--y);color:var(--ink);font-size:11px;font-weight:900;min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.burger{display:none;width:42px;height:42px;border-radius:50%;background:var(--ink3);place-items:center}
@media (max-width:1120px){
  nav.main{position:fixed;inset:66px 0 auto 0;flex-direction:column;background:var(--ink);padding:12px 20px 20px;gap:2px;display:none;border-bottom:1px solid var(--line)}
  nav.main.open{display:flex}
  nav.main a{padding:12px 14px;font-size:16px}
  .burger{display:grid}
  .hact{margin-inline-start:auto}
}

/* hero */
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 38px,rgba(255,128,0,.05) 38px 46px);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:72px}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,128,0,.12);color:var(--y);border:1px solid rgba(255,128,0,.35);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700}
.hero h1{font-size:clamp(30px,4.6vw,52px);line-height:1.25;font-weight:900;margin:18px 0 14px}
.hero h1 em{font-style:normal;color:var(--y)}
.hero p.lead{color:#cfcfcf;font-size:17px;max-width:560px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--y);color:var(--ink)}
.btn.y:hover{background:var(--y2)}
.btn.o{border:1.5px solid #555;color:#fff}
.btn.o:hover{border-color:#fff}
.btn.d{background:var(--ink);color:#fff}
.btn.wa{background:#1FAF55;color:#fff}
.btn svg{width:18px;height:18px}

.finder{background:var(--ink2);border:1px solid var(--line);border-radius:22px;padding:22px}
.finder h3{font-size:17px;margin-bottom:4px}
.finder p{font-size:13px;color:var(--mut);margin-bottom:16px}
.sizerow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;direction:ltr}
.sizerow label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px;text-align:center}
select.s{width:100%;background:var(--ink3);border:1px solid #3a3a3a;color:#fff;border-radius:12px;padding:11px 10px;font-size:16px;font-weight:700;text-align:center;appearance:none}
.sizehint{direction:ltr;text-align:center;font-size:26px;font-weight:900;letter-spacing:1px;margin:14px 0;color:var(--y)}
.finder .btn{width:100%;justify-content:center}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-top:40px;padding-bottom:48px}}

/* sections */
section.blk{padding:64px 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sh h2{font-size:clamp(24px,3vw,32px);font-weight:900;line-height:1.3}
.sh p{color:var(--sub);margin-top:4px}
.sh a.more{font-weight:700;border-bottom:2px solid var(--y)}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cat{background:var(--card);border-radius:var(--r);padding:22px;border:1px solid #e9e7e0;transition:.2s;display:block}
.cat:hover{transform:translateY(-3px);box-shadow:0 12px 30px -16px rgba(0,0,0,.25);border-color:var(--y)}
.cat .ic{width:48px;height:48px;border-radius:14px;background:var(--ink);display:grid;place-items:center;margin-bottom:14px}
.cat .ic svg{width:26px;height:26px;color:var(--y)}
.cat h3{font-size:17px}
.cat p{font-size:14px;color:var(--sub)}
@media (max-width:860px){.cats{grid-template-columns:1fr 1fr}}

.why{background:var(--ink);color:#fff;border-radius:28px;padding:44px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.why .it b{display:block;font-size:30px;font-weight:900;color:var(--y);line-height:1.2}
.why .it span{color:#cfcfcf;font-size:14px}
@media (max-width:860px){.why{grid-template-columns:1fr 1fr;padding:28px}}

/* products */
.shop{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
.filters{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid #e9e7e0;position:sticky;top:84px}
.filters h4{font-size:14px;margin:14px 0 8px;color:var(--sub)}
.filters h4:first-child{margin-top:0}
.fsel{width:100%;border:1px solid #ddd;border-radius:10px;padding:9px 10px;background:#fafafa}
.fin{width:100%;border:1px solid #ddd;border-radius:10px;padding:9px 12px;background:#fafafa}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;direction:ltr}
.reset{margin-top:16px;font-size:14px;font-weight:700;color:var(--sub);text-decoration:underline}
@media (max-width:860px){.shop{grid-template-columns:1fr}.filters{position:static}}
.count{color:var(--sub);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pc{background:var(--card);border-radius:var(--r);border:1px solid #e9e7e0;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.pc:hover{box-shadow:0 14px 34px -18px rgba(0,0,0,.3)}
.pc .img{aspect-ratio:4/3;background:linear-gradient(160deg,#f1efe8,#e5e2d8);display:grid;place-items:center;position:relative;cursor:pointer}
.pc .img img{width:100%;height:100%;object-fit:cover}
.pc .img .ph{width:46%;opacity:.85}
.oos{position:absolute;bottom:10px;inset-inline-end:10px;background:#c62828;color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.oosbig{display:inline-block;background:#c62828;color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;margin-top:8px}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--ink);color:var(--y);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.pc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .br{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px}
.pc h3{font-size:16px;line-height:1.45;cursor:pointer}
.pc .sz{direction:ltr;text-align:start;font-weight:900;font-size:18px}
.stars{color:#E8A400;font-size:13px}
.stars small{color:var(--sub)}
.pc .war{font-size:12px;background:#FFF6D6;color:#7a5a00;padding:4px 9px;border-radius:8px;align-self:flex-start;font-weight:600}
.pc .act{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.pc .act .btn{padding:9px 14px;font-size:14px;flex:1;justify-content:center}
.empty{background:var(--card);border-radius:var(--r);padding:40px;text-align:center;color:var(--sub);border:1px dashed #ccc}

/* product modal + drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none}
.ov.on{display:block}
.modal{position:fixed;z-index:90;inset:auto 0 0 0;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:24px;display:none;max-width:760px;margin:0 auto}
.modal.on{display:block}
@media (min-width:860px){.modal{inset:50% auto auto 50%;transform:translate(-50%,-50%);border-radius:24px;width:760px}}
.x{position:absolute;top:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;background:#f0f0f0;font-size:20px;line-height:1}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:700px){.mgrid{grid-template-columns:1fr}}
.spec{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.spec td{padding:7px 0;border-bottom:1px solid #eee;vertical-align:top}
.spec td:first-child{color:var(--sub);width:42%}
.spec td+td{text-align:start}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#f1f1f1;border-radius:999px;padding:3px 10px;font-size:13px}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--card);z-index:90;transform:translateX(110%);transition:.25s;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-110%)}
.drawer.on{transform:none!important}
.drawer .hd{padding:20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.drawer .ls{flex:1;overflow:auto;padding:12px 20px}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0;align-items:center}
.ci .t{flex:1;font-size:14px}
.ci .t b{display:block;direction:ltr;text-align:start}
.qty{display:flex;align-items:center;border:1px solid #ddd;border-radius:999px}
.qty button{width:30px;height:30px;font-size:16px}
.qty span{min-width:22px;text-align:center;font-weight:700}
.drawer .ft{padding:20px;border-top:1px solid #eee}
.drawer .ft .btn{width:100%;justify-content:center}
.drawer .note{font-size:12px;color:var(--sub);margin-top:8px;text-align:center}

/* articles */
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.arts{grid-template-columns:1fr}}
.ac{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid #e9e7e0;display:flex;flex-direction:column;transition:.2s}
.ac:hover{transform:translateY(-3px);box-shadow:0 14px 34px -18px rgba(0,0,0,.3)}
.ac .cv{aspect-ratio:16/9;display:grid;place-items:center;position:relative;overflow:hidden}
.ac .cv svg{width:42%;opacity:.95}
.ac .bd{padding:16px 18px 20px}
.ac .meta{font-size:12px;color:var(--sub);display:flex;gap:10px;align-items:center}
.ac .kind{background:var(--ink);color:var(--y);padding:2px 9px;border-radius:999px;font-weight:700}
.ac h3{font-size:18px;line-height:1.5;margin:8px 0 6px}
.ac p{font-size:14px;color:var(--sub)}

/* unified search */
.ustabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--ink3);border-radius:16px;padding:5px;margin:10px 0 16px}
.ustabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;color:#cfcfcf;font-weight:700;font-size:14px}
.ustabs button svg{width:22px;height:22px}
.ustabs button.on{background:var(--y);color:var(--ink)}
.uspanel{display:none}.uspanel.on{display:block}
.usrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.usrow label,.uslbl{font-size:11px;color:var(--mut);display:block;margin-bottom:4px;text-align:center}
.finder input.s{width:100%;background:var(--ink3);border:1px solid #3a3a3a;color:#fff;border-radius:12px;padding:11px 12px;font-size:16px;font-weight:600;margin-bottom:12px}
.finder input.s::placeholder{color:#8a8a8a;font-weight:500}
.uslink{display:block;text-align:center;margin-top:12px;font-size:14px;font-weight:700;color:var(--y)}
@media (max-width:860px){.hero .finder{order:-1}.hero .wrap>div:not(.finder){display:none}.hero .wrap{padding-top:22px;padding-bottom:26px}}
/* shop tabs */
.shoptabs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.shoptabs a{padding:9px 18px;border-radius:999px;background:var(--ink3);color:#ddd;font-weight:700;font-size:15px}
.shoptabs a.on{background:var(--y);color:var(--ink)}
/* oil filters */
.ofil{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.ofil label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
@media (max-width:700px){.ofil{grid-template-columns:1fr}}
.askbox{background:var(--card);border:1px dashed #ccc;border-radius:var(--r);padding:24px;text-align:center;margin-bottom:24px}
.askbox p{color:var(--sub);margin-bottom:14px}
/* battery form */
.batcard{background:var(--ink);color:#fff;border-radius:20px;padding:24px;margin-bottom:28px;max-width:560px}
.batcard .s{margin-bottom:0}
.batcard .btn{width:100%;justify-content:center;margin-top:6px}
.batcard input.s{width:100%;background:var(--ink3);border:1px solid #3a3a3a;color:#fff;border-radius:12px;padding:11px 12px;font-size:16px;margin-bottom:12px}
.tips{display:grid;gap:12px;max-width:720px}
.tips div{background:var(--card);border-radius:14px;padding:16px 18px;border-inline-start:5px solid var(--y)}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid #e0ded6;font-weight:600;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
article.post{max-width:760px;margin:0 auto;background:var(--card);border-radius:24px;padding:clamp(22px,5vw,48px);border:1px solid #e9e7e0}
article.post h1{font-size:clamp(24px,3.4vw,34px);line-height:1.4;margin:12px 0 8px;font-weight:900}
article.post .meta{color:var(--sub);font-size:14px;margin-bottom:22px}
article.post h2{font-size:21px;margin:26px 0 8px}
article.post p,article.post li{font-size:16.5px;color:#2a2a2a;margin-bottom:12px}
article.post ul{padding-inline-start:22px}
article.post .box{background:#FFF6D6;border-inline-start:4px solid var(--y);padding:14px 16px;border-radius:10px;margin:18px 0}
article.post .ltr{direction:ltr;display:inline-block;font-weight:700}
article.post a:not(.btn){color:#FF8000;font-weight:700;text-decoration:underline;text-underline-offset:3px}
article.post img.hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;margin:0 0 22px;display:block}
.back{display:inline-flex;gap:6px;font-weight:700;margin-bottom:18px}

/* contact */
.ct{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.ct{grid-template-columns:1fr}}
.cbox{background:var(--card);border-radius:var(--r);padding:26px;border:1px solid #e9e7e0}
.crow{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #f0f0f0}
.crow:last-child{border:0}
.crow .ic{width:44px;height:44px;border-radius:12px;background:var(--ink);display:grid;place-items:center;flex-shrink:0}
.crow .ic svg{width:20px;height:20px;color:var(--y)}
.crow small{display:block;color:var(--sub);font-size:12px}
.crow b{direction:ltr;display:inline-block}
.map{border-radius:var(--r);overflow:hidden;min-height:320px;border:1px solid #e9e7e0}
.map iframe{width:100%;height:100%;min-height:320px;border:0}

footer{background:var(--ink);color:#bbb;padding:44px 0 26px;margin-top:40px}
footer .fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}
footer h5{color:#fff;font-size:15px;margin-bottom:10px}
footer a{display:block;padding:3px 0;font-size:14px}
footer a:hover{color:var(--y)}
footer .cp{border-top:1px solid var(--line);margin-top:28px;padding-top:18px;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:860px){footer .fg{grid-template-columns:1fr}}

.fab{position:fixed;bottom:20px;inset-inline-start:20px;z-index:40;width:56px;height:56px;border-radius:50%;background:#1FAF55;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
.fab svg{width:28px;height:28px;color:#fff}
.fab.ig{bottom:86px;background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.igrid .instagram-media{min-width:0!important;max-width:100%!important;margin:0!important}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:100;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.page{display:none}
.page.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pagehead{background:var(--ink);color:#fff;padding:44px 0}
.pagehead h1{font-size:clamp(26px,3.6vw,38px);font-weight:900}
.pagehead p{color:#cfcfcf}

/* brands & oils */
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bt{background:var(--card);border:1px solid #e9e7e0;border-radius:14px;padding:16px 12px;text-align:center;transition:.2s;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.bt:hover{border-color:var(--y);transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(0,0,0,.3)}
.bt .mono{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center;font-weight:900;font-size:20px;letter-spacing:-.5px;direction:ltr}
.bt b{font-size:15px;direction:ltr;letter-spacing:.3px}
.bt small{font-size:12px;color:var(--sub)}
.bt.stock{border-color:var(--y);background:#FFFBEB}
.bt .st{font-size:10px;background:var(--y);color:var(--ink);border-radius:999px;padding:1px 8px;font-weight:700}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.gr{background:var(--card);border:1px solid #e9e7e0;border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:.2s}
.gr:hover{border-color:var(--y);background:#FFFBEB}
.gr b{display:block;direction:ltr;font-size:19px;font-weight:900}
.gr small{color:var(--sub);font-size:12px}
.gsec{margin-bottom:34px}
.gsec h3{font-size:19px;margin-bottom:4px}
.gsec p.d{color:var(--sub);font-size:14px;margin-bottom:14px}
.info{background:var(--ink);color:#e8e8e8;border-radius:20px;padding:26px;margin-bottom:34px}
.info h3{color:var(--y);margin-bottom:8px}
.info p{font-size:15px}
.info .ltr{direction:ltr;display:inline-block;font-weight:700;color:#fff}
.sizes-all{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.sizes-all button{background:var(--card);border:1px solid #e0ded6;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600}
.sizes-all button:hover{border-color:var(--y);background:#FFFBEB}
.sizes-all button.in{background:var(--y);border-color:var(--y)}
.rimh{font-weight:900;font-size:15px;margin:14px 0 6px;direction:ltr;text-align:start}
.note2{font-size:13px;color:var(--sub);margin-top:14px}
/* forms & account */
.box2{background:var(--card);border:1px solid #e9e7e0;border-radius:var(--r);padding:22px;margin-bottom:18px}
.box2 h3{font-size:18px;margin-bottom:12px}
.fg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.fld label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px 12px;background:#fafafa}
.fld textarea{min-height:70px}
.ltrin{direction:ltr;text-align:left}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:14px;display:none}
.msg.ok{display:block;background:#E8F7EE;color:#14632f}
.msg.err{display:block;background:#FDECEC;color:#8a1c1c}
.vinbox{display:flex;gap:8px;flex-wrap:wrap}
.vinbox input{flex:1;min-width:220px;font-size:18px;font-weight:700;letter-spacing:1px;direction:ltr;text-transform:uppercase;border:2px solid var(--ink);border-radius:12px;padding:12px 14px}
.car-res{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
@media (max-width:760px){.car-res{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--sub)}
.kv dd{font-weight:700;direction:ltr;text-align:start}
.chipbtn{display:inline-block;margin:4px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--ink);font-weight:700;direction:ltr;cursor:pointer;background:#fff}
.chipbtn:hover{background:var(--y);border-color:var(--y)}
.tabs2{display:flex;gap:6px;margin-bottom:16px}
.tabs2 button{padding:8px 16px;border-radius:999px;border:1px solid #ddd;background:#fff;font-weight:700}
.tabs2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table.lst{width:100%;border-collapse:collapse;font-size:14px}
table.lst th,table.lst td{padding:8px 6px;border-bottom:1px solid #eee;text-align:start;vertical-align:top}
table.lst th{color:var(--sub);font-weight:600;font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eee}
.pill.new{background:#FFF1C2}.pill.confirmed,.pill.processing{background:#DCEBFF}.pill.done,.pill.delivered{background:#DDF5E4}.pill.cancelled{background:#F5DADA}
.due{background:#FFF6D6;border-inline-start:4px solid var(--y);padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:14px}
.empty2{color:var(--sub);font-size:14px;padding:8px 0}
.disclaim{font-size:12px;color:var(--sub);margin-top:10px}

/* product page */
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:start}
@media (max-width:860px){.pd{grid-template-columns:1fr;gap:20px}}
.gal .main{aspect-ratio:1;border-radius:var(--r);background:linear-gradient(160deg,#f1efe8,#e5e2d8);display:grid;place-items:center;overflow:hidden;border:1px solid #e9e7e0}
.gal .main img{width:100%;height:100%;object-fit:contain;background:#fff}
.gal .main .ph{width:52%}
.gal .th{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.gal .th button{flex:0 0 70px;height:70px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:#fff;cursor:pointer}
.gal .th button.on{border-color:var(--y)}
.gal .th img{width:100%;height:100%;object-fit:cover}
.pi .brd{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px}
.pi h1{font-size:26px;line-height:1.35;margin:4px 0}
.pi .bigsz{direction:ltr;text-align:start;font-size:28px;font-weight:900}
.pi .rt{display:flex;align-items:center;gap:8px;margin:6px 0 2px;color:var(--sub);font-size:14px}
.pi .rt b{color:var(--y);letter-spacing:1px;font-size:16px}
.qbox{background:var(--card);border:1px solid #e9e7e0;border-radius:var(--r);padding:16px;margin-top:16px}
.qrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qctl{display:flex;align-items:center;border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#fff}
.qctl button{width:44px;height:46px;border:0;background:#f6f5f1;font-size:22px;cursor:pointer}
.qctl input{width:56px;height:46px;border:0;text-align:center;font-size:18px;font-weight:800;-moz-appearance:textfield}
.qctl input::-webkit-outer-spin-button,.qctl input::-webkit-inner-spin-button{-webkit-appearance:none}
.qpre{display:flex;gap:6px}
.qpre button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.qpre button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.psel{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.psel button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;direction:ltr}
.psel button.on{border-color:var(--y);background:#FFF1E3}
.pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pbtns .btn{flex:1;justify-content:center;min-width:150px}
.psec{background:var(--card);border:1px solid #e9e7e0;border-radius:var(--r);padding:20px;margin-top:20px}
.psec h2{font-size:19px;margin-bottom:10px}
.psec p.dsc{line-height:1.9;color:#333;white-space:pre-line}
.rv{border-top:1px solid #eee;padding:12px 0}
.rv:first-of-type{border-top:0}
.rv .hd{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.rv .hd b{color:var(--y);letter-spacing:1px}
.rv p{margin-top:4px;line-height:1.8;color:#333}
.rsum{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.rsum .n{font-size:40px;font-weight:900}
.stpick{display:flex;gap:4px;direction:ltr;justify-content:flex-end}
.stpick button{font-size:30px;line-height:1;border:0;background:none;color:#ccc;cursor:pointer;padding:0 2px}
.stpick button.on{color:var(--y)}
.crumb{font-size:14px;color:var(--sub);margin-bottom:14px}
.crumb a{color:var(--sub)}
</style>
</head>

<h2>راننده: مارک باسنگ</h2>
<p>پشت فرمان <b>مارک باسنگ (Marc Basseng)</b>، راننده‌ی مسابقه‌ای آلمانی، نشسته بود. او همان کسی است که رکورد قبلی همین خودرو را هم ثبت کرده بود: ۴۹۶٫۲۲ کیلومتر در ساعت در سپتامبر ۲۰۲۵ در پیست آزمایشی پاپنبورگ آلمان. یعنی رکورد جدید ۶٫۹۵ کیلومتر بالاتر از رکورد قبلی خودش است.</p>
<h2>رکورد چطور ثبت شد؟</h2>

<li><b>روز دوم (۱ نوامبر):</b> سرعت به ۵۰۳٫۱۷ رسید.</li></ul>
<p>این پروژه با همکاری دفتر سرمایه‌گذاری ابوظبی، اداره‌ی فرهنگ و گردشگری ابوظبی و مرکز حمل‌ونقل یکپارچه‌ی ابوظبی انجام شد.</p>
<div class="box">یک نکته‌ی منصفانه: این سرعت در یک مسیر یک‌طرفه ثبت شده است، نه میانگین رفت و برگشت که روش معمول بعضی رکوردهای سرعت است.</div>
<h2>قهرمان پنهان: لاستیک</h2>
<p>در ۵۰۰ کیلومتر در ساعت، لاستیک زیر بدترین فشار ممکن است: نیروی گریز از مرکز عظیم، گرمای شدید و کوچک‌ترین ضربه از جاده. برای همین BYD با شرکت <b>Giti</b> لاستیک مخصوصی برای این خودرو ساخت:</p>
<ul><li><b>مدل:</b> <span class="ltr">GitiSport e.GTR2 Pro</span>، لاستیک نیمه‌اسلیک (آج کم، تماس بیشتر با جاده).</li>
<li><b>سایز</b> (طبق تصویر رسمی Giti): <span class="ltr">325/35R20 (112Y) XL</span>.</li>
<li><b>کار اصلی:</b> جلوگیری از اینکه لاستیک و رینگ زیر آن نیروهای عظیم نسبت به هم جابه‌جا شوند.</li></ul>
<p>از چهار رکورد گینس این روز، دو رکورد مال خود لاستیک بود:</p>
<ul><li>🏆 سریع‌ترین لاستیک خودروی برقی دنیا</li>
<li>🏆 سریع‌ترین لاستیک خودروی جاده‌ای دنیا</li></ul>
<p>دو رکورد دیگر «سریع‌ترین خودروی تولیدی» و «سریع‌ترین خودروی برقی تولیدی» بودند.</p>
<h2>خودرو در یک نگاه</h2>
<ul><li>چهار موتور برقی با مجموع بیش از ۳۰۰۰ اسب بخار؛ هر موتور تا ۳۰ هزار دور در دقیقه.</li>
<li>معماری برقی ۱۲۰۰ ولت و باتری «بلید» از نوع LFP.</li>
<li>نسبت قدرت به وزن: ۱۲۱۷ اسب بخار به ازای هر تُن.</li>
<li>تعلیق فعال DiSus-X که هر چرخ را جداگانه کنترل می‌کند.</li>
<li>فقط ۳۰ دستگاه در دنیا تولید می‌شود.</li></ul>
<h2>درس این رکورد برای لاستیک خودروی شما</h2>
<p>شاید هیچ‌وقت ۵۰۳ کیلومتر نرانید، ولی نکته‌ی جالب این است که یکی از چیزهایی که مهندس‌ها شبانه تنظیم کردند <b>فشار باد لاستیک</b> بود. فشار باد درست برای هر لاستیکی مهم است:</p>
<p><b>۱. حرف سرعت لاستیکتان را بشناسید.</b> روی هر لاستیک بعد از عدد شاخص بار یک حرف هست که حداکثر سرعت مجاز را نشان می‌دهد. مثلاً روی لاستیک <span class="ltr">205/55R16 91H</span>، حرف <b>H</b> یعنی حداکثر ۲۱۰ کیلومتر در ساعت.</p>
<ul><li><b>S</b>: ۱۸۰ · <b>T</b>: ۱۹۰ · <b>H</b>: ۲۱۰</li>
<li><b>V</b>: ۲۴۰ · <b>W</b>: ۲۷۰ · <b>Y</b>: ۳۰۰ کیلومتر در ساعت</li></ul>
<p>موقع تعویض، حرف سرعت لاستیک جدید باید برابر یا بالاتر از لاستیک اصلی کارخانه باشد. برای خواندن بقیه‌ی اعداد روی لاستیک، <a href="#/article/read-tire-size">این راهنما</a> را ببینید.</p>
<p><b>۲. فشار باد را ماهی یک بار و قبل از سفر چک کنید</b>، وقتی لاستیک سرد است. فشار کم در گرمای عمان لاستیک را داغ می‌کند و عمرش را کم می‌کند؛ بیشتر بخوانید در <a href="#/article/tires-oman-heat">راهنمای لاستیک در گرمای عمان</a>.</p>
<p><b>۳. آج را نگاه کنید.</b> میخ، سنگ‌ریزه یا بریدگی را جدی بگیرید؛ مهندس‌های این رکورد هم برای همین جاده را جارو کردند.</p>
<h2>زاد CSC</h2>
<p>قرار نیست رکورد بشکنید، ولی لاستیکتان ارزش یک بررسی را دارد. در صلاله، صنعتی صحلنوت، فشار باد، آج و تاریخ تولید لاستیک‌هایتان را بررسی می‌کنیم. برای هماهنگی با <span class="ltr">96569646</span> تماس بگیرید یا واتساپ بدهید.</p>
<h2>منابع</h2>
<ul><li>FIA و Guinness World Records (از طریق BYD)</li><li>The National، Khaleej Times، electrive، Electrek، Autocar Professional، SayaraBay</li><li>Giti Tire (تصویر رسمی محصول)</li></ul>`},
  ar:{t:"التاير اللي تحمّل 503 كم/س على طريق في أبوظبي",
      s:"مارك باسنغ قاد يانغوانغ U9 Xtreme لأسرع رقم لسيارة إنتاج في العالم على طريق E11. والبطل الخفي كان تاير Giti.",
      b:`<p>في <b>1 نوفمبر 2026</b>، وعلى جزء مسكّر من طريق <b>E11</b> (طريق الشيخ خليفة بن زايد الدولي) في منطقة الظفرة بأبوظبي، وصلت السيارة الكهربائية الخارقة <span class="ltr">BYD Yangwang U9 Xtreme</span> إلى <b>503.17 كم بالساعة</b>، وصارت أول سيارة إنتاج في العالم تتعدى حاجز 500 كم بالساعة. والاتحاد الدولي للسيارات (FIA) أكّد السرعة.</p>
<h2>السايق: مارك باسنغ</h2>
<p>ورى الدركسون كان <b>مارك باسنغ (Marc Basseng)</b>، سايق سباقات ألماني. وهو نفسه اللي سجّل الرقم القديم لنفس السيارة: 496.22 كم بالساعة في سبتمبر 2025 على حلبة اختبار باپنبورغ في ألمانيا. يعني كسر رقمه هو بفارق 6.95 كم بالساعة.</p>
<h2>كيف انسجّل الرقم؟</h2>
<ul><li>سكّروا 10 كم من الطريق عشان يكون فيه خط مستقيم طوله 7 كم للوصول لأعلى سرعة.</li>
<li>بما إن الطريق جنب الصحرا، كنسوا الإسفلت وفحصوه كامل عشان ما تضر أي حصاة الكفرات.</li>
<li><b>اليوم الأول (31 أكتوبر):</b> أعلى سرعة كانت 490 كم بالساعة.</li>
<li><b>في الليل:</b> المهندسين عدّلوا حرارة البطارية والمحركات، وزاوية الجناح الخلفي، وبرنامج التعليق، و<b>ضغط هوا الكفرات</b>.</li>
<li><b>اليوم الثاني (1 نوفمبر):</b> السرعة وصلت 503.17 كم بالساعة.</li></ul>
<p>المشروع كان بالتعاون مع مكتب أبوظبي للاستثمار، ودائرة الثقافة والسياحة – أبوظبي، ومركز النقل المتكامل في أبوظبي.</p>
<div class="box">ملاحظة للإنصاف: السرعة انسجّلت في اتجاه واحد، مب معدّل رايح وراجع مثل ما تتسجّل بعض أرقام السرعة عادةً.</div>
<h2>البطل الخفي: التاير</h2>
<p>على 500 كم بالساعة، التاير يكون تحت أقسى ضغط ممكن: قوة طرد مركزي هائلة، وحرارة عالية، وأي ضربة صغيرة من الطريق. عشان كذا BYD اشتغلت مع شركة <b>Giti</b> على تاير خاص لهالسيارة:</p>
<ul><li><b>الموديل:</b> <span class="ltr">GitiSport e.GTR2 Pro</span>، تاير شبه سليك (دعسة قليلة وتلامس أكثر مع الطريق).</li>
<li><b>المقاس</b> (حسب صورة Giti الرسمية): <span class="ltr">325/35R20 (112Y) XL</span>.</li>
<li><b>مهمته الأساسية:</b> يمنع التاير والجنط يتزحزحون عن بعض تحت هالقوى الهائلة.</li></ul>
<p>من أربعة أرقام غينيس انسجّلت هاليوم، اثنين كانوا للتاير نفسه:</p>
<ul><li>🏆 أسرع تاير سيارة كهربائية في العالم</li>
<li>🏆 أسرع تاير سيارة طريق في العالم</li></ul>
<p>والرقمين الثانيين: «أسرع سيارة إنتاج» و«أسرع سيارة إنتاج كهربائية».</p>
<h2>السيارة في سطور</h2>
<ul><li>أربعة محركات كهربائية بقوة إجمالية أكثر من 3000 حصان؛ كل محرك يوصل 30 ألف لفة في الدقيقة.</li>
<li>نظام كهربائي 1200 فولت وبطارية «بليد» من نوع LFP.</li>
<li>نسبة القوة للوزن: 1217 حصان لكل طن.</li>
<li>تعليق نشط DiSus-X يتحكم في كل كفر لحاله.</li>
<li>بس 30 سيارة بتنصنع في العالم.</li></ul>
<h2>وش نتعلم لتاير سيارتك؟</h2>
<p>يمكن عمرك ما بتسوق 503 كم بالساعة، بس اللافت إن من الأشياء اللي ظبطها المهندسين في الليل كان <b>ضغط الهوا</b>. والضغط الصح مهم لأي تاير:</p>
<p><b>1. اعرف حرف السرعة في تايرك.</b> على كل تاير، بعد رقم الحمولة فيه حرف يبيّن أقصى سرعة مسموحة. مثلاً على تاير <span class="ltr">205/55R16 91H</span>، حرف <b>H</b> يعني أقصى سرعة 210 كم بالساعة.</p>
<ul><li><b>S</b>: 180 · <b>T</b>: 190 · <b>H</b>: 210</li>
<li><b>V</b>: 240 · <b>W</b>: 270 · <b>Y</b>: 300 كم بالساعة</li></ul>
<p>لما تبدّل، حرف السرعة في التاير الجديد لازم يكون مثل الأصلي أو أعلى. ولقراءة باقي الأرقام على التاير، شوف <a href="#/article/read-tire-size">هالدليل</a>.</p>
<p><b>2. شيك ضغط الهوا كل شهر وقبل السفر</b>، والتاير بارد. الضغط الناقص في حر عُمان يسخّن التاير ويقصّر عمره؛ اقرأ أكثر في <a href="#/article/tires-oman-heat">دليل التواير في حر عُمان</a>.</p>
<p><b>3. شوف الدعسة.</b> مسمار أو حصى أو قص؟ لا تأجل؛ حتى مهندسين الرقم القياسي كنسوا الطريق عشان نفس السبب.</p>
<h2>زاد CSC</h2>
<p>مب ناوي تكسر رقم قياسي؟ بس تايرك يستاهل فحص. في صلالة – صناعية صحلنوت، نشيّك على ضغط الهوا والدعسة وتاريخ الصنع. تواصل معنا اتصال أو واتساب على <span class="ltr">96569646</span>.</p>
<h2>المصادر</h2>
<ul><li>FIA وموسوعة غينيس للأرقام القياسية (عبر BYD)</li><li>The National، الخليج تايمز، electrive، Electrek، Autocar Professional، SayaraBay</li><li>Giti Tire (صورة المنتج الرسمية)</li></ul>`},
  en:{t:"The tire that survived 503 km/h on an Abu Dhabi road",
      s:"Marc Basseng drove the Yangwang U9 Xtreme to the world's fastest production-car speed on the E11. The hidden hero was a Giti tire.",
      b:`<p>On <b>1 November 2026</b>, on a closed section of the <b>E11</b> (Sheikh Khalifa Bin Zayed International Road) in Abu Dhabi's Al Dhafra region, the <span class="ltr">BYD Yangwang U9 Xtreme</span> electric hypercar reached <b>503.17 km/h</b>, becoming the first production car to pass 500 km/h. The FIA confirmed the speed.</p>
<h2>The driver: Marc Basseng</h2>
<p>Behind the wheel was <b>Marc Basseng</b>, a German racing driver — the same driver who set the car's previous record of 496.22 km/h at Germany's ATP Papenburg test track in September 2025. He beat his own mark by 6.95 km/h.</p>
<h2>How the record was set</h2>
<ul><li>A 10 km stretch of road was closed, leaving a 7 km straight for the top-speed run.</li>
<li>Because the road runs beside the desert, the surface was swept and inspected so no stones could damage the tires.</li>
<li><b>Day one (31 October):</b> top speed was 490 km/h.</li>
<li><b>Overnight:</b> engineers adjusted battery and motor temperatures, rear-wing angle, suspension software and <b>tire pressure</b>.</li>
<li><b>Day two (1 November):</b> the car hit 503.17 km/h.</li></ul>
<p>The attempt was supported by the Abu Dhabi Investment Office, the Department of Culture and Tourism – Abu Dhabi, and Abu Dhabi Mobility.</p>
<div class="box">For fairness: the speed was set as a one-way run, not the two-direction average some speed records use.</div>
<h2>The hidden hero: the tire</h2>
<p>At 500 km/h a tire faces the harshest possible conditions: enormous centrifugal force, intense heat and any tiny hit from the road. So BYD worked with <b>Giti</b> on a tire made for this car:</p>
<ul><li><b>Model:</b> <span class="ltr">GitiSport e.GTR2 Pro</span>, a semi-slick (shallow tread, more contact with the road).</li>
<li><b>Size</b> (per Giti's official image): <span class="ltr">325/35R20 (112Y) XL</span>.</li>
<li><b>Main job:</b> keeping tire and rim from shifting against each other under those huge forces.</li></ul>
<p>Of the four Guinness World Records set that day, two went to the tire itself:</p>
<ul><li>🏆 Fastest EV tire in the world</li>
<li>🏆 Fastest road-car tire in the world</li></ul>
<p>The other two were "Fastest Production Car" and "Fastest Electric Production Car".</p>
<h2>The car at a glance</h2>
<ul><li>Four electric motors with more than 3,000 hp combined; each spins up to 30,000 rpm.</li>
<li>1,200-volt architecture and a "Blade" LFP battery.</li>
<li>Power-to-weight: 1,217 hp per tonne.</li>
<li>DiSus-X active suspension controlling each wheel independently.</li>
<li>Only 30 will be built.</li></ul>
<h2>What it means for your tires</h2>
<p>You'll probably never drive at 503 km/h, but one of the things engineers fixed overnight was <b>tire pressure</b> — and the right pressure matters for every tire:</p>
<p><b>1. Know your speed rating.</b> After the load index on every tire is a letter showing its maximum speed. On a <span class="ltr">205/55R16 91H</span> tire, <b>H</b> means 210 km/h max.</p>
<ul><li><b>S</b>: 180 · <b>T</b>: 190 · <b>H</b>: 210</li>
<li><b>V</b>: 240 · <b>W</b>: 270 · <b>Y</b>: 300 km/h</li></ul>
<p>When replacing tires, the new speed rating should match or exceed the original. See <a href="#/article/read-tire-size">our guide</a> to the rest of the sidewall code.</p>
<p><b>2. Check pressure monthly and before trips</b>, with tires cold. Low pressure in Oman's heat overheats tires and shortens their life — more in <a href="#/article/tires-oman-heat">our heat guide</a>.</p>
<p><b>3. Look at the tread.</b> Nails, stones or cuts? Don't wait — the record team swept the road for the same reason.</p>
<h2>Zad CSC</h2>
<p>Not planning to break a record? Your tires still deserve a check. In Salalah, Sahalnoot Industrial Area, we'll check pressure, tread and production date. Call or WhatsApp <span class="ltr">96569646</span>.</p>
<h2>Sources</h2>
<ul><li>FIA and Guinness World Records (via BYD)</li><li>The National, Khaleej Times, electrive, Electrek, Autocar Professional, SayaraBay</li><li>Giti Tire (official product image)</li></ul>`}

      b:`<p>اگر امسال لاستیک خریده باشید، احتمالاً متوجه شده‌اید که قیمت‌ها بالاتر از سال گذشته است. این گرانی فقط مال یک برند یا یک مغازه نیست؛ یک موج جهانی است که از اوایل ۲۰۲۶ شروع شد. در این مقاله توضیح می‌دهیم چه اتفاقی افتاده، اوضاع الان چطور است و به نظر ما بهترین تصمیم برای خرید چیست.</p>
<h2>همه‌چیز از نفت شروع شد</h2>
<p>از اواخر فوریه‌ی ۲۰۲۶، اوضاع منطقه روی تنگه‌ی هرمز و مسیرهای کشتیرانی اثر گذاشت. قیمت نفت برنت در اوج خود بیش از ۵۰٪ بالا رفت و حمل‌ونقل دریایی در منطقه به‌شدت مختل شد.</p>
<p>شاید بپرسید نفت چه ربطی به لاستیک دارد؟ بخش بزرگی از مواد سازنده‌ی لاستیک از نفت به دست می‌آید:</p>
<ul><li><b>لاستیک مصنوعی</b> (مثل بوتادین): در چین قیمت بوتادین ظرف یک هفته ۲۵٪ جهش کرد.</li>
<li><b>کربن سیاه</b>: ماده‌ای که به لاستیک رنگ مشکی و مقاومت می‌دهد.</li>
<li><b>روغن‌ها و مواد شیمیایی</b> که در ترکیب لاستیک استفاده می‌شوند.</li></ul>
<h2>حمل و بیمه هم گران شد</h2>
<p>بیشتر لاستیک‌های بازار خلیج وارداتی‌اند و بخش بزرگی از آن‌ها از آسیا می‌آید. پیش‌بینی می‌شد چین به‌تنهایی بیش از ۷ میلیون لاستیک به خاورمیانه صادر کند، اما جهش کرایه‌ی حمل و بیمه‌ی ریسک جنگ این مسیر را گران و کند کرد. تغییر مسیر کشتی‌ها هم یعنی زمان بیشتر و هزینه‌ی بیشتر.</p>
<h2>کارخانه‌ها قیمت‌ها را بالا بردند</h2>
<ul><li>از مارس ۲۰۲۶ موج افزایش قیمت شروع شد؛ گودیر، پیرلی و ده‌ها سازنده‌ی آسیایی اطلاعیه‌ی افزایش قیمت دادند.</li>
<li>فقط از آوریل به بعد، بیش از ۸۰ سازنده (بیشترشان در چین) قیمت‌ها را بین <b>۲ تا ۱۰ درصد</b> بالا بردند.</li>
<li>پیرلی در آوریل یک «برنامه‌ی مقابله» شامل افزایش قیمت و کاهش هزینه فعال کرد.</li>
<li>میشلن اعلام کرده در سه‌ماهه‌ی سوم ۲۰۲۶ در واکنش به گرانی مواد اولیه قیمت‌ها را بالا برده است. این شرکت در ۱۷ نوامبر هم گفت بحران منطقه ممکن است دست‌کم <b>۴۰۰ میلیون یورو</b> به هزینه‌هایش اضافه کند.</li>
<li>بریجستون هم هزینه‌های مرتبط با خاورمیانه را بیش از ۴۰۰ میلیون دلار برآورد کرده است.</li>
<li>میانگین هزینه‌ی ساخت هر لاستیک در سه‌ماهه‌ی دوم ۲۰۲۶ حدود <b>۲۲٪</b> بالاتر از سال قبل بوده است.</li></ul>
<div class="box">تحلیلگران بانک بارکلیز می‌گویند سازنده‌های لاستیک در بازار لاستیک جایگزین (یعنی همان خرید مشتری از مغازه) قدرت قیمت‌گذاری خوبی دارند؛ یعنی معمولاً این هزینه‌ها را به مشتری منتقل می‌کنند.</div>
<h2>در عمان و منطقه چه خبر است؟</h2>
<ul><li>طبق مرکز ملی آمار و اطلاعات عمان، شاخص قیمت واردات در سه‌ماهه‌ی دوم ۲۰۲۶ نسبت به سال قبل <b>۱۱٫۷٪</b> بالا رفت و گروه سوخت‌ها و مواد مرتبط بیشترین افزایش را داشت (۴۵٫۵٪).</li>
<li>یک فروشنده‌ی لاستیک در امارات تخمین زده قیمت بیشتر لاستیک‌ها بین ۸ تا ۲۰ درصد بالاتر از اوایل ۲۰۲۵ است. این برآورد خود آن فروشنده است و به‌طور مستقل تأیید نشده.</li></ul>
<h2>قیمت‌ها کی پایین می‌آید؟</h2>
<p>جواب صادقانه این است که کسی دقیق نمی‌داند. ولی نشانه‌ها این‌ها هستند:</p>
<ul><li>✅ <b>خبر خوب:</b> نفت از اوج حدود ۱۱۸ دلاری اواخر اکتبر حدود ۲۰٪ پایین آمده و صادرات نفت از منطقه تقریباً به سطح قبل از بحران برگشته است.</li>
<li>❌ <b>ولی:</b> ریسک کشتیرانی هنوز بالاست و بیمه و حمل گران مانده‌اند.</li>
<li>❌ بانک جهانی پیش‌بینی می‌کند قیمت لاستیک طبیعی در ۲۰۲۷ حدود ۴٫۵٪ دیگر بالا برود.</li>
<li>⏳ <b>تأخیر:</b> قیمت لاستیک با چند ماه فاصله از قیمت مواد اولیه حرکت می‌کند. لاستیکی که امروز در انبارهاست با مواد گران ماه‌های قبل ساخته شده؛ پس حتی اگر نفت ارزان شود، قیمت لاستیک فوراً پایین نمی‌آید.</li></ul>
<div class="box">جمع‌بندی ما: احتمال اینکه قیمت لاستیک در چند ماه آینده به‌طور محسوس پایین بیاید کم است.</div>
<h2>الان بخریم یا صبر کنیم؟ توصیه‌ی ما</h2>
<p><b>۱. اگر لاستیکتان موعد تعویضش رسیده، صبر نکنید.</b> یعنی:</p>
<ul><li>آج تمام شده یا نزدیک به تمام شدن است.</li>
<li>روی دیواره یا بین آج‌ها ترک دیده می‌شود.</li>
<li>بیش از ۵ سال از تاریخ تولیدش گذشته است.</li>
<li>باد مدام کم می‌کند یا قلمبگی دارد.</li></ul>
<p>رانندگی با لاستیک فرسوده در گرمای عمان خطر واقعی دارد؛ ارزش چند ریال صرفه‌جویی را ندارد. درباره‌ی اثر گرما روی لاستیک، <a href="#/article/tires-oman-heat">این راهنما</a> را بخوانید.</p>
<p><b>۲. لاستیک اضافه انبار نکنید.</b> لاستیک حتی وقتی استفاده نشود پیر می‌شود. خرید چهار لاستیک برای سال بعد، فقط به این امید که ارزان‌تر بخرید، تصمیم درستی نیست.</p>
<p><b>۳. تاریخ تولید را چک کنید.</b> چهار رقم آخر بعد از کلمه‌ی <span class="ltr">DOT</span> هفته و سال تولید را نشان می‌دهد؛ مثلاً <span class="ltr">0326</span> یعنی هفته‌ی سوم سال ۲۰۲۶. وقتی قیمت‌ها بالاست، بعضی‌ها موجودی کهنه را ارزان‌تر می‌فروشند؛ لاستیک تازه بخواهید. راهنمای کامل را <a href="#/article/dot-tire-age">این‌جا</a> بخوانید.</p>
<h2>ما در زاد CSC چه می‌کنیم؟</h2>
<p>اگر مطمئن نیستید لاستیکتان باید عوض شود، سری به ما در صلاله، صنعتی صحلنوت بزنید تا وضعیت آج، تاریخ و سلامت لاستیک را برایتان بررسی کنیم و صادقانه بگوییم الان لازم است یا نه. برای استعلام قیمت سایز خودرویتان هم با شماره‌ی <span class="ltr">96569646</span> تماس بگیرید یا پیام واتساپ بدهید.</p>

      s:"من مضيق هرمز لين رفّ المحل: ليش غليت التواير في 2026، ومتى ممكن ترخص، وهل تشتري الحين أو تنتظر.",
      b:`<p>إذا اشتريت تواير هالسنة، أكيد لاحظت إن الأسعار أعلى من السنة اللي فاتت. هالغلاء مب خاص ببراند معيّن أو محل معيّن؛ هو موجة عالمية بدأت من بداية 2026. في هالمقال نشرح وش صار، وكيف الوضع الحين، ووش رأينا في أفضل قرار للشراء.</p>
<h2>كل شي بدأ من النفط</h2>
<p>من أواخر فبراير 2026، أثّرت الأوضاع في المنطقة على مضيق هرمز وطرق الشحن. سعر خام برنت ارتفع في ذروته أكثر من 50٪، والنقل البحري في المنطقة تعطّل بشكل كبير.</p>
<p>طيب وش دخل النفط في التاير؟ جزء كبير من مكونات التاير يجي من النفط:</p>
<ul><li><b>المطاط الصناعي</b> (مثل البوتادايين): في الصين ارتفع سعره 25٪ خلال أسبوع واحد.</li>
<li><b>الكربون الأسود</b>: المادة اللي تعطي التاير لونه الأسود وقوته.</li>
<li><b>الزيوت والمواد الكيميائية</b> اللي تدخل في خلطة المطاط.</li></ul>
<h2>والشحن والتأمين غليوا بعد</h2>
<p>أغلب التواير في سوق الخليج مستوردة، وجزء كبير منها يجي من آسيا. كان متوقع إن الصين لحالها تصدّر أكثر من 7 ملايين تاير للشرق الأوسط، بس ارتفاع أجور الشحن وتأمين مخاطر الحرب خلّى هالطريق أغلى وأبطأ. وتغيير مسارات السفن يعني وقت أطول وتكلفة أكثر.</p>
<h2>المصانع رفعت أسعارها</h2>
<ul><li>من مارس 2026 بدأت موجة رفع الأسعار؛ غوديير وبيريللي وعشرات المصنّعين الآسيويين أعلنوا زيادات.</li>
<li>من أبريل وبس، أكثر من 80 مصنّع (أغلبهم في الصين) رفعوا أسعارهم بين <b>2٪ و10٪</b>.</li>
<li>بيريللي فعّلت في أبريل «خطة لتخفيف الأثر» فيها رفع أسعار وتقليل تكاليف.</li>
<li>ميشلان أعلنت إنها رفعت أسعارها في الربع الثالث 2026 بسبب غلاء المواد الخام، وقالت في 17 نوفمبر إن أزمة المنطقة ممكن تزيد تكاليفها <b>400 مليون يورو</b> على الأقل.</li>
<li>بريجستون قدّرت التكاليف المرتبطة بالشرق الأوسط بأكثر من 400 مليون دولار.</li>
<li>متوسط تكلفة تصنيع التاير في الربع الثاني 2026 كان أعلى بحوالي <b>22٪</b> من السنة اللي قبلها.</li></ul>
<div class="box">محللين بنك باركليز يقولون إن مصنّعي التواير عندهم قوة تسعير في سوق الإطارات البديلة (يعني شراء الزبون من المحل)، يعني عادةً ينقلون هالتكاليف للمستهلك.</div>
<h2>وش الوضع في عُمان والمنطقة؟</h2>
<ul><li>حسب المركز الوطني للإحصاء والمعلومات، ارتفع الرقم القياسي لأسعار الواردات في عُمان <b>11.7٪</b> في الربع الثاني 2026 مقارنة بالسنة الماضية، وأعلى زيادة كانت في مجموعة الوقود والمواد المرتبطة (45.5٪).</li>
<li>محل تواير في الإمارات قدّر إن أغلب التواير صارت أغلى بين 8٪ و20٪ من بداية 2025. هذا تقدير المحل نفسه وما تم التحقق منه بشكل مستقل.</li></ul>
<h2>متى بتنزل الأسعار؟</h2>
<p>الجواب بصراحة: ما حد يعرف بالضبط. بس هذي المؤشرات:</p>
<ul><li>✅ <b>الخبر الزين:</b> النفط نزل حوالي 20٪ من ذروته (حوالي 118 دولار) في أواخر أكتوبر، وصادرات النفط من المنطقة رجعت تقريباً لمستواها قبل الأزمة.</li>
<li>❌ <b>بس:</b> مخاطر الشحن للحين عالية، والتأمين والنقل للحين غاليين.</li>
<li>❌ البنك الدولي يتوقع سعر المطاط الطبيعي يرتفع حوالي 4.5٪ زيادة في 2027.</li>
<li>⏳ <b>التأخير:</b> أسعار التواير تمشي متأخرة كم شهر عن أسعار المواد الخام. التاير اللي في المخازن اليوم انصنع بمواد غالية من شهور؛ فحتى لو رخص النفط، سعر التاير ما بينزل على طول.</li></ul>
<div class="box">خلاصتنا: احتمال إن أسعار التواير تنزل بشكل واضح في الشهور الجاية ضعيف.</div>
<h2>نشتري الحين أو ننتظر؟ نصيحتنا</h2>
<p><b>1. إذا تايرك وصل وقت تبديله، لا تنتظر.</b> يعني:</p>
<ul><li>الدعسة خلصت أو قربت تخلص.</li>
<li>فيه تشققات على الجدار أو بين الدعسات.</li>
<li>عمره أكثر من 5 سنوات من تاريخ الصنع.</li>
<li>ينقص هواه دايماً أو فيه انتفاخ.</li></ul>
<p>السواقة بتاير تعبان في حر عُمان خطر حقيقي، وما تستاهل توفير كم ريال. عن تأثير الحرارة على التواير، اقرأ <a href="#/article/tires-oman-heat">هالدليل</a>.</p>
<p><b>2. لا تخزّن تواير زيادة.</b> التاير يكبر حتى لو ما استخدمته. شراء أربع تواير للسنة الجاية بس عشان أمل إنك توفّر، مب قرار صح.</p>
<p><b>3. شيك تاريخ الصنع.</b> آخر 4 أرقام بعد كلمة <span class="ltr">DOT</span> تبيّن أسبوع وسنة الصنع؛ مثلاً <span class="ltr">0326</span> يعني الأسبوع الثالث من 2026. لما تكون الأسعار عالية، بعض الناس يبيعون مخزون قديم بسعر أرخص؛ اطلب تاير جديد. الدليل الكامل <a href="#/article/dot-tire-age">هنا</a>.</p>
<h2>وش نسوي في زاد CSC؟</h2>
<p>إذا مب متأكد إن تايرك يبي تبديل، زورنا في صلالة – صناعية صحلنوت، ونشيّك لك على الدعسة وتاريخ الصنع وحالة التاير، ونقول لك بصراحة إذا لازم تبدّل الحين أو لا. ولسعر مقاس سيارتك، اتصل أو راسلنا واتساب على <span class="ltr">96569646</span>.</p>

  en:{t:"Will tire prices drop soon? A full look at the 2026 price rise",
      s:"From the Strait of Hormuz to the shop shelf: why tires got pricier in 2026, when they might ease, and whether to buy now or wait.",
      b:`<p>If you've bought tires this year, you've probably noticed prices are higher than last year. It isn't one brand or one shop — it's a global wave that began in early 2026. Here's what happened, where things stand now, and what we think is the smartest way to buy.</p>
<h2>It started with oil</h2>
<p>From late February 2026, the situation in the region disrupted the Strait of Hormuz and shipping routes. Brent crude rose more than 50% at its peak, and sea freight across the region was badly disrupted.</p>
<p>Why does oil matter for tires? Much of what goes into a tire comes from oil:</p>
<ul><li><b>Synthetic rubber</b> (such as butadiene): in China its price jumped 25% in a single week.</li>
<li><b>Carbon black</b>: what gives a tire its black colour and strength.</li>
<li><b>Oils and chemicals</b> used in the rubber compound.</li></ul>
<h2>Shipping and insurance got pricier too</h2>
<p>Most tires sold in the Gulf are imported, many from Asia. China alone had been expected to ship more than 7 million tires to the Middle East, but soaring freight rates and war-risk insurance made that route slower and more expensive. Rerouted ships mean more time and more cost.</p>
<h2>Manufacturers raised prices</h2>
<ul><li>A wave of increases began in March 2026, with Goodyear, Pirelli and dozens of Asian makers announcing hikes.</li>
<li>From April alone, more than 80 manufacturers (mostly in China) raised prices by <b>2% to 10%</b>.</li>
<li>In April Pirelli activated a "mitigation plan" including price increases and cost cuts.</li>
<li>Michelin says it raised prices in Q3 2026 in response to higher input costs, and on 17 November said the regional crisis could add at least <b>€400 million</b> to its costs.</li>
<li>Bridgestone put Middle East-related cost increases at more than $400 million.</li>
<li>The average cost of building a tire in Q2 2026 was about <b>22%</b> higher than a year earlier.</li></ul>
<div class="box">Barclays analysts say tire makers have solid pricing power in the replacement market (what drivers buy at the shop), so these costs usually get passed on to customers.</div>
<h2>What about Oman and the region?</h2>
<ul><li>According to Oman's National Centre for Statistics and Information, the import price index rose <b>11.7%</b> year on year in Q2 2026, led by mineral fuels and related materials (+45.5%).</li>
<li>A UAE tire retailer estimates most tires now cost 8–20% more than in early 2025. That's the retailer's own estimate and hasn't been independently verified.</li></ul>
<h2>When will prices come down?</h2>
<p>The honest answer: nobody knows exactly. Here are the signals:</p>
<ul><li>✅ <b>Good news:</b> oil has fallen about 20% from its late-October peak of roughly $118, and crude exports from the region are back near pre-crisis levels.</li>
<li>❌ <b>But:</b> shipping risk is still high, and insurance and freight remain expensive.</li>
<li>❌ The World Bank expects natural rubber prices to rise about 4.5% more in 2027.</li>
<li>⏳ <b>The lag:</b> tire prices trail raw-material prices by several months. Tires in warehouses today were made with expensive materials months ago, so even if oil gets cheaper, tire prices won't drop straight away.</li></ul>
<div class="box">Our take: a clear drop in tire prices over the next few months looks unlikely.</div>
<h2>Buy now or wait? Our advice</h2>
<p><b>1. If your tires are due, don't wait.</b> That means:</p>
<ul><li>The tread is worn out or close to it.</li>
<li>There are cracks on the sidewall or between the tread blocks.</li>
<li>The tire is more than 5 years past its production date.</li>
<li>It keeps losing air or has a bulge.</li></ul>
<p>Driving on worn tires in Oman's heat is a real risk — not worth saving a few rials. Read <a href="#/article/tires-oman-heat">our guide</a> on how heat affects tires.</p>
<p><b>2. Don't stockpile.</b> Tires age even when unused. Buying four spare tires for next year just in the hope of saving isn't a smart move.</p>
<p><b>3. Check the production date.</b> The last four digits after <span class="ltr">DOT</span> show the week and year it was made — <span class="ltr">0326</span> means week 3 of 2026. When prices are high, some sellers clear old stock cheaply; ask for fresh tires. Full guide <a href="#/article/dot-tire-age">here</a>.</p>
<h2>How Zad CSC can help</h2>
<p>Not sure if your tires need replacing? Visit us in Salalah, Sahalnoot Industrial Area, and we'll check the tread, age and condition and tell you honestly whether you need new tires now. For a price on your size, call or WhatsApp <span class="ltr">96569646</span>.</p>

<li><b>هشدار زودهنگام آب‌سواری (آکواپلنینگ):</b> خودرو زودتر می‌فهمد تایر روی آب در حال سُر خوردن است.</li>
<li><b>کنترل کشش دقیق‌تر:</b> تایر خودش را به خودرو معرفی می‌کند و تنظیمات بر اساس همان تایر انجام می‌شود.</li>
<li><b>همکاری با بوش:</b> داده‌ها مستقیم به سیستم‌های <span class="ltr">ABS</span>، <span class="ltr">ESP</span> و کنترل کشش می‌رسد.</li>
<li><b>اطلاعات جاده:</b> داده‌ی تایرها می‌تواند خرابی و خطرهای جاده را گزارش کند.</li></ul>
<div class="box">به گفته‌ی پیرلی، این فناوری در آینده به خودروهای خودران «حس لامسه» می‌دهد؛ یعنی خودرو بفهمد زیر چرخ‌هایش دقیقاً چه خبر است.</div>
<h2>از کجا شروع شد؟</h2>
<p>مدیر فنی پیرلی می‌گوید ایده‌ی تبدیل تایر به یک «سنسور فعال» بیش از بیست سال پیش شکل گرفت. مک‌لارن آرتورا در ۲۰۲۱ اولین خودرویی بود که با تایرهای سنسوردار پیرلی از کارخانه عرضه شد. حالا پیرلی پاگانی اوتوپیا رودستر را اولین خودرویی معرفی می‌کند که نسخه‌ی کامل Cyber Tyre را به‌صورت استاندارد دارد.</p>
<h2>برنامه‌ی پیرلی در آمریکا</h2>
<p>این خبر بخشی از یک سرمایه‌گذاری بزرگ است که هیئت‌مدیره‌ی پیرلی در ۲۲ سپتامبر ۲۰۲۶ تصویب کرد:</p>
<ul><li>حدود <b>۱٫۲ میلیارد دلار</b> برای توسعه‌ی کارخانه‌ی رُم در ایالت جورجیا (پیرلی از ۲۰۰۲ آن‌جا حضور دارد).</li>
<li>شروع برنامه از <b>۲۰۲۷</b> و رسیدن ظرفیت به حدود <b>۶ میلیون تایر در سال</b> تا ۲۰۳۳.</li>
<li>حدود <b>۱۰۰۰ شغل جدید</b>.</li>
<li>تولید تایرهای مجهز به Cyber Tyre، ارتقای خط تولید رباتیک و یک خط کاملاً خودکار جدید برای تایرهای پریمیوم.</li></ul>
<p>آمریکا حدود ۴۰٪ حجم جهانی تایرهای گران‌قیمت (High Value) را دارد؛ برای همین پیرلی می‌خواهد آن‌جا محلی تولید کند.</p>
<h2>چرا تا الان به آمریکا نرفته بود؟</h2>
<p>پیرلی در اطلاعیه‌ی رسمی‌اش دلیل را نگفته است. ولی گزارش‌های رویترز و بلومبرگ ماجرا را روشن می‌کنند:</p>
<ul><li>شرکت دولتی چینی <b>سینوکیم (Sinochem)</b> از ۲۰۱۵ بزرگ‌ترین سهام‌دار پیرلی است؛ ابتدا با حدود ۳۷٪ و حالا حدود ۳۴٪.</li>
<li>آمریکا در اوایل ۲۰۲۵ قانونی نهایی کرد که فروش سخت‌افزار و نرم‌افزار «خودروهای متصل» مرتبط با چین و روسیه را ممنوع می‌کند.</li>
<li>Cyber Tyre داده جمع می‌کند و با خودرو حرف می‌زند؛ پس دقیقاً زیر ذره‌بین این قانون رفت و آمریکا به پیرلی هشدار داد.</li>
<li>دولت ایتالیا با «اختیارات طلایی» (Golden Power) وارد شد و در آوریل ۲۰۲۶ تعداد اعضای هیئت‌مدیره‌ای را که سینوکیم می‌تواند معرفی کند به سه نفر محدود کرد.</li>
<li>بعد از آن، پیرلی در مه ۲۰۲۶ تولید Cyber Tyre در جورجیا را اعلام کرد و اداره‌ی صنعت و امنیت آمریکا (BIS) هم اجازه‌ی فروش داد.</li></ul>
<div class="box">خلاصه: تأخیر به‌خاطر فناوری نبود؛ به‌خاطر سهام‌دار چینی و رقابت فناوری آمریکا و چین بود. حتی تایر هم حالا بخشی از سیاست شده است.</div>
<h2>برای ما در عمان چه معنایی دارد؟</h2>
<p>فعلاً Cyber Tyre بیشتر روی خودروهای فوق‌لوکس و به‌صورت تجهیزات کارخانه عرضه می‌شود و به این زودی در بازار عادی تایر نمی‌بینیمش. ولی جهت حرکت روشن است: تایرها هوشمند می‌شوند. قابلیتی مثل هشدار آب‌سواری برای جاده‌های خیس صلاله در فصل خریف واقعاً کاربردی است.</p>
<p>تا آن روز، ساده‌ترین کار برای ایمنی این است که فشار باد را مرتب چک کنید و تایر را قبل از تمام شدن آج عوض کنید.</p>
<h2>منابع</h2>
<ul><li>اطلاعیه‌ی رسمی پیرلی، ۲۳ نوامبر ۲۰۲۶</li><li>Reuters، Bloomberg، Carscoops، Automotive World، evo</li></ul>`},
  ar:{t:"تاير بيريللي الذكي وصل أمريكا… ليش تأخر لين الحين؟",
      s:"بيريللي أطلقت تقنية Cyber Tyre في أمريكا خلال سباق لاس فيغاس. ما ذكرت سبب التأخير في إعلانها، بس القصة سياسية مب تقنية.",
      b:`<p>في <b>23 نوفمبر 2026</b>، وخلال سباق فورمولا 1 في لاس فيغاس، أعلنت بيريللي دخول تقنية <span class="ltr">Cyber Tyre</span> إلى السوق الأمريكي، بحضور رئيس مجلس الإدارة والرئيس التنفيذي وسفير إيطاليا في واشنطن. الخبر يبان بسيط، بس وراه أكثر من سنة من الشد والجذب بين أمريكا والصين وإيطاليا.</p>
<h2>وش هو Cyber Tyre؟</h2>
<p>حساس صغير يُلصق داخل التاير، يقيس هوية التاير والضغط والحرارة والتسارع، ويرسلها للسيارة بالبلوتوث، وتعالجها برامج وخوارزميات بيريللي لحظة بلحظة.</p>
<ul><li>وزن الحساس حوالي 12 غرام، وبطاريته تعيش حوالي خمس سنوات.</li>
<li>الإطارات اللي فيها هالتقنية عليها علامة <b class="ltr">C</b> على الجدار.</li></ul>
<h2>وش فايدته؟</h2>
<ul><li><b>فرملة أقصر:</b> نظام <span class="ltr">ABS</span> يعرف نقطة أقصى تماسك للتاير، فتقصر مسافة التوقف.</li>
<li><b>تحذير مبكر من الانزلاق على الماي:</b> السيارة تحس بخطر الانزلاق قبل لا يصير.</li>
<li><b>تحكم أدق بالجر:</b> التاير يعرّف نفسه للسيارة، والإعدادات تتظبط على نفس التاير.</li>
<li><b>شراكة مع بوش:</b> البيانات توصل مباشرة لأنظمة <span class="ltr">ABS</span> و<span class="ltr">ESP</span> والتحكم بالجر.</li>
<li><b>معلومات عن الطريق:</b> بيانات الإطارات تقدر تنبه عن الحفر ومخاطر الطريق.</li></ul>
<div class="box">حسب بيريللي، هالتقنية بتعطي السيارات ذاتية القيادة «حاسة لمس»، يعني السيارة تعرف بالضبط وش تحت كفراتها.</div>
<h2>من وين بدأت القصة؟</h2>
<p>المدير الفني لبيريللي يقول إن فكرة تحويل التاير إلى «حساس نشط» بدأت قبل أكثر من عشرين سنة. ماكلارين أرتورا في 2021 كانت أول سيارة تنزل من المصنع بإطارات بيريللي فيها حساسات، واليوم تقدّم بيريللي باغاني أوتوبيا رودستر كأول سيارة تجي بالنسخة الكاملة من Cyber Tyre بشكل أساسي.</p>
<h2>خطة بيريللي في أمريكا</h2>
<p>الخبر جزء من استثمار كبير وافق عليه مجلس إدارة بيريللي في 22 سبتمبر 2026:</p>
<ul><li>حوالي <b>1.2 مليار دولار</b> لتوسعة مصنع روما في ولاية جورجيا (بيريللي موجودة هناك من 2002).</li>
<li>البرنامج يبدأ في <b>2027</b>، والطاقة توصل حوالي <b>6 ملايين تاير سنوياً</b> بحلول 2033.</li>
<li>حوالي <b>1000 وظيفة جديدة</b>.</li>
<li>تصنيع إطارات Cyber Tyre، وتطوير خط الإنتاج الروبوتي، وخط جديد مؤتمت بالكامل للإطارات الفاخرة.</li></ul>
<p>أمريكا فيها حوالي 40٪ من حجم الإطارات الفاخرة في العالم، وعشان كذا بيريللي تبي تصنع هناك محلياً.</p>
<h2>ليش ما دخل أمريكا من قبل؟</h2>
<p>بيريللي ما ذكرت السبب في إعلانها الرسمي، بس تقارير رويترز وبلومبرغ توضح القصة:</p>
<ul><li>شركة <b>سينوكيم</b> الصينية الحكومية أكبر مساهم في بيريللي من 2015، بحصة كانت حوالي 37٪ واليوم حوالي 34٪.</li>
<li>أمريكا اعتمدت في بداية 2025 قانون يمنع بيع أنظمة وبرامج «السيارات المتصلة» المرتبطة بالصين وروسيا.</li>
<li>Cyber Tyre يجمع بيانات ويكلم السيارة، فدخل مباشرة تحت هالقانون، وأمريكا حذّرت بيريللي.</li>
<li>الحكومة الإيطالية تدخلت بصلاحيات «القوة الذهبية»، وفي أبريل 2026 حدّدت عدد أعضاء مجلس الإدارة اللي تقدر سينوكيم ترشحهم بثلاثة فقط.</li>
<li>بعدها، في مايو 2026، أعلنت بيريللي تصنيع Cyber Tyre في جورجيا، ووافق مكتب الصناعة والأمن الأمريكي (BIS) على بيعه.</li></ul>
<div class="box">الخلاصة: التأخير ما كان بسبب التقنية، كان بسبب المساهم الصيني والتنافس التقني بين أمريكا والصين. حتى التاير صار سياسة.</div>
<h2>وش يعني لنا في عُمان؟</h2>
<p>حالياً Cyber Tyre ينزل بشكل رئيسي مع السيارات الفاخرة جداً من المصنع، وما بنشوفه في سوق الإطارات العادي قريب. بس الاتجاه واضح: الإطارات صايرة ذكية. ميزة مثل التحذير من الانزلاق على الماي مفيدة فعلاً لطرق صلالة المبللة في موسم الخريف.</p>
<p>لين ذاك الوقت، أبسط شي لسلامتك: افحص ضغط الهواء بانتظام، وبدّل التاير قبل لا تخلص الدعسة.</p>
<h2>المصادر</h2>

  en:{t:"Pirelli's smart tire reaches the US — so why did it take so long?",
      s:"Pirelli launched Cyber Tyre in the US at the Las Vegas Grand Prix. Its announcement skipped the reason for the delay, but the story is political, not technical.",
      b:`<p>On <b>23 November 2026</b>, during the Formula 1 Las Vegas Grand Prix, Pirelli announced it is bringing <span class="ltr">Cyber Tyre</span> to the US market. The chairman, the CEO and Italy's ambassador to the US attended. Simple as it sounds, the launch follows more than a year of tension between the US, China and Italy.</p>
<h2>What is Cyber Tyre?</h2>
<p>A small sensor is bonded inside the tread. It measures the tire's ID, pressure, temperature and acceleration and sends them to the car over Bluetooth, where Pirelli's own software and algorithms process them in real time.</p>
<ul><li>The sensor weighs about 12 grams and its battery lasts around five years.</li>
<li>Tires with the technology carry a <b>C</b> mark on the sidewall.</li></ul>
<h2>What does it do?</h2>
<ul><li><b>Shorter braking:</b> ABS knows the tire's point of maximum grip, so stopping distances shrink.</li>
<li><b>Earlier aquaplaning warning:</b> the car senses the risk of sliding on water sooner.</li>
<li><b>Smarter traction control:</b> the tire identifies itself, so settings match that exact tire.</li>
<li><b>Bosch partnership:</b> tire data feeds ABS, ESP and traction control directly.</li>
<li><b>Road data:</b> tire readings can flag potholes and road hazards.</li></ul>
<div class="box">Pirelli says the technology will give self-driving cars a "sense of touch" — knowing exactly what is happening under the wheels.</div>
<h2>Where it started</h2>
<p>Pirelli's CTO says the idea of turning the tire into an "active sensor" goes back more than twenty years. The McLaren Artura became the first car to leave the factory on Pirelli sensor tires in 2021, and Pirelli now presents the Pagani Utopia Roadster as the first car with the full Cyber Tyre system as standard.</p>
<h2>Pirelli's US plan</h2>
<p>The launch is part of a large investment Pirelli's board approved on 22 September 2026:</p>
<ul><li>About <b>$1.2 billion</b> to expand its plant in Rome, Georgia (Pirelli has been there since 2002).</li>
<li>The programme starts in <b>2027</b>, reaching about <b>6 million tires a year</b> by 2033.</li>
<li>About <b>1,000 new jobs</b>.</li>
<li>Cyber Tyre production, upgraded robotic manufacturing and a new fully automated premium line.</li></ul>
<p>The US accounts for about 40% of global high-value tire volumes, which is why Pirelli wants to build there.</p>
<h2>Why not earlier?</h2>
<p>Pirelli's announcement doesn't say. Reporting by Reuters and Bloomberg fills the gap:</p>
<ul><li>China's state-owned <b>Sinochem</b> has been Pirelli's largest shareholder since 2015 — around 37% at first, about 34% today.</li>
<li>In early 2025 the US finalised a rule banning connected-vehicle hardware and software linked to China and Russia.</li>
<li>Cyber Tyre collects data and talks to the car, so it fell squarely under the rule, and the US warned Pirelli.</li>
<li>Italy stepped in with its "golden power" rules and, in April 2026, capped the board seats Sinochem can nominate at three.</li>
<li>In May 2026 Pirelli announced Cyber Tyre production in Georgia, and the US Bureau of Industry and Security cleared it for sale.</li></ul>
<div class="box">Bottom line: the delay wasn't about technology. It was about a Chinese shareholder and the US–China tech race. Even tires are political now.</div>
<h2>What it means for us in Oman</h2>
<p>For now Cyber Tyre is mainly factory-fitted to high-end supercars, so it won't reach the regular tire market soon. But the direction is clear: tires are getting smart. An aquaplaning warning would be genuinely useful on Salalah's wet roads during the khareef.</p>
<p>Until then, the simplest safety habit is to check your tire pressure regularly and replace tires before the tread wears out.</p>
<h2>Sources</h2>
<ul><li>Pirelli press release, 23 November 2026</li><li>Reuters, Bloomberg, Carscoops, Automotive World, evo</li></ul>`}

  fa:{t:"اولین تایر تاریخ عربستان؛ کارخانه‌ی پیرلی در ۲۰۲۷ به تولید می‌رسد",
      s:"صندوق سرمایه‌گذاری عربستان و پیرلی در شهر اقتصادی ملک عبدالله کارخانه‌ی تایر می‌سازند؛ با مواد اولیه از سابک و یک برند سعودی تازه.",
      b:`<p>عربستان تا امروز حتی یک تایر سواری هم تولید نکرده است. این قرار است در <b>۲۰۲۷</b> عوض شود. مدیرعامل پیرلی گفته اولین تایری که این شرکت در عربستان می‌سازد، «اولین تایر تاریخ این کشور» خواهد بود.</p>
<h2>چه کسانی پشت این پروژه‌اند؟</h2>
<ul><li><b>صندوق سرمایه‌گذاری‌های عمومی عربستان (PIF)</b> با ۷۵٪ سهم.</li>
<li><b>پیرلی</b> با ۲۵٪ سهم، به‌عنوان شریک فنی که طراحی، توسعه و بهره‌برداری کارخانه را پشتیبانی می‌کند.</li>
<li>شرکت مشترک «Mena Tyre Company» نام دارد و قرارداد آن در ۲۶ اکتبر ۲۰۲۳ امضا شد.</li>
<li>سرمایه‌گذاری کل حدود <b>۵۵۰ میلیون دلار</b> (حدود ۲ میلیارد ریال سعودی) است.</li></ul>
<h2>کجا؟</h2>
<p>کارخانه در <b>خوشه‌ی خودروسازی ملک سلمان</b> در <b>شهر اقتصادی ملک عبدالله (KAEC)</b>، در استان مکه و کنار دریای سرخ ساخته می‌شود. این خوشه همان جایی است که عربستان می‌خواهد به قطب خودروسازی منطقه تبدیلش کند؛ برند خودروی ملی «سیر» (Ceer) و کارخانه‌های لوسید و هیوندای هم بخشی از همین برنامه‌اند.</p>
<p>قرارداد ساخت کارخانه به ارزش حدود ۶۲۸ میلیون ریال (۱۶۷ میلیون دلار) در سپتامبر ۲۰۲۵ به شرکت «سعودی امانه» داده شد.</p>
<h2>چه چیزی تولید می‌کند؟</h2>
<ul><li>ظرفیت سالانه: <b>۳٫۵ میلیون تایر</b> سواری.</li>
<li>تایرهای پریمیوم با برند <b>پیرلی</b>.</li>
<li>یک <b>برند سعودی جدید</b> برای بازار عربستان و منطقه. اسم این برند هنوز اعلام نشده است.</li></ul>
<h2>حتی مواد اولیه هم محلی است</h2>
<p>در فوریه‌ی ۲۰۲۶ شرکت <b>سابک (SABIC)</b> قراردادی امضا کرد تا لاستیک مصنوعی (بوتادین) و کربن سیاه را برای این کارخانه تأمین کند. این اولین قرارداد از این نوع برای تأمین مواد اولیه‌ی تولید تایر در داخل عربستان است.</p>
<h2>چرا تأخیر داشت؟</h2>
<p>در برنامه‌ی اولیه، تولید باید از <b>۲۰۲۶</b> شروع می‌شد. مدیرعامل پیرلی در فوریه‌ی ۲۰۲۶ گفت اولین تولید در نیمه‌ی دوم ۲۰۲۷، «به احتمال زیاد سه‌ماهه‌ی سوم» انجام می‌شود و در ژوئن هم از «تا اواسط ۲۰۲۷» حرف زد. پس موعد واقعی حدود یک سال عقب افتاده است.</p>
<div class="box">جمع‌بندی زمان‌بندی: اعلام پروژه ۲۰۲۳ ← قرارداد ساخت ۲۰۲۵ ← قرارداد مواد اولیه با سابک ۲۰۲۶ ← اولین تولید ۲۰۲۷.</div>
<h2>چرا برای بازار خلیج مهم است؟</h2>
<p>تقریباً همه‌ی تایرهای بازار خلیج فارس وارداتی‌اند. طبق برآورد Marqstats، حدود ۳۸٫۹ میلیون تایر در ۲۰۲۵ در کشورهای شورای همکاری خلیج فروخته شد و تایرهای چینی حدود ۴۱٪ ارزش بازار را داشتند. کارخانه‌ی جدید با ظرفیت ۳٫۵ میلیون تایر، حدود ۹٪ تقاضای کل منطقه را پوشش می‌دهد.</p>
<ul><li><b>زنجیره‌ی تأمین کوتاه‌تر:</b> تایر پیرلی ساخت خود منطقه.</li>
<li><b>رقیب تازه:</b> برند سعودی جدید می‌تواند با تایرهای وارداتی ارزان رقابت کند.</li>
<li><b>قیمت:</b> هنوز چیزی درباره‌ی قیمت‌ها اعلام نشده؛ باید صبر کرد.</li></ul>
<h2>نظر ما</h2>
<p>برای مشتری‌های عمان، این یعنی احتمالاً در ۲۰۲۷ و ۲۰۲۸ گزینه‌های بیشتری روی قفسه‌ها می‌بینیم. ما در زاد CSC خبرهای این کارخانه را دنبال می‌کنیم و به‌محض عرضه، مشخصات و قیمت را اعلام می‌کنیم.</p>
<h2>منابع</h2>
<ul><li>اطلاعیه‌ی صندوق سرمایه‌گذاری‌های عمومی عربستان و پیرلی، اکتبر ۲۰۲۳</li><li>سابک (از طریق الاقتصادیه و ارقام)، فوریه‌ی ۲۰۲۶</li><li>MEED، European Rubber Journal، Adnkronos، Marqstats</li></ul>`},
  ar:{t:"أول تاير في تاريخ السعودية… مصنع بيريللي يبدأ الإنتاج في 2027",
      s:"صندوق الاستثمارات العامة وبيريللي يبنون مصنع إطارات في مدينة الملك عبدالله الاقتصادية، بمواد خام من سابك وبراند سعودي جديد.",
      b:`<p>السعودية لين اليوم ما صنعت ولا تاير سيارة واحد، وهذا بيتغير في <b>2027</b>. الرئيس التنفيذي لبيريللي قال إن أول تاير تصنعه الشركة في المملكة بيكون «أول تاير يُصنع في تاريخ البلد».</p>
<h2>من وراء المشروع؟</h2>
<ul><li><b>صندوق الاستثمارات العامة (PIF)</b> بحصة 75٪.</li>
<li><b>بيريللي</b> بحصة 25٪، كشريك تقني يدعم تصميم المصنع وتطويره وتشغيله.</li>
<li>اسم المشروع المشترك «شركة مينا للإطارات» (Mena Tyre Company)، وانعلن في 26 أكتوبر 2023.</li>
<li>الاستثمار الإجمالي حوالي <b>550 مليون دولار</b> (قرابة 2 مليار ريال سعودي).</li></ul>
<h2>وين؟</h2>
<p>المصنع داخل <b>مجمع الملك سلمان لصناعة السيارات</b> في <b>مدينة الملك عبدالله الاقتصادية</b>، في منطقة مكة على ساحل البحر الأحمر. هذا المجمع هو اللي تبي السعودية تخليه مركز صناعة السيارات في المنطقة، ومعه براند «سير» الوطني ومصانع لوسيد وهيونداي.</p>
<p>عقد بناء المصنع بقيمة حوالي 628 مليون ريال (167 مليون دولار) انعطى لشركة «السعودية أمانة» في سبتمبر 2025.</p>
<h2>وش بيصنع؟</h2>
<ul><li>الطاقة السنوية: <b>3.5 مليون تاير</b> لسيارات الركاب.</li>
<li>إطارات فاخرة تحت علامة <b>بيريللي</b>.</li>
<li><b>براند سعودي جديد</b> للسوق السعودي والمنطقة، واسمه للحين ما انعلن.</li></ul>
<h2>حتى المواد الخام سعودية</h2>
<p>في فبراير 2026 وقّعت <b>سابك</b> اتفاقية لتوريد المطاط الصناعي (البوتادايين) والكربون الأسود للمصنع، وهي أول اتفاقية من نوعها لتوريد مواد خام لتصنيع الإطارات محلياً في المملكة.</p>
<h2>ليش تأخر؟</h2>
<p>الخطة الأصلية كانت بداية الإنتاج في <b>2026</b>. في فبراير 2026 قال الرئيس التنفيذي لبيريللي إن أول إنتاج بيكون في النصف الثاني من 2027، «على الأغلب الربع الثالث»، وفي يونيو تكلم عن «منتصف 2027». يعني الموعد الفعلي تأخر حوالي سنة.</p>
<div class="box">الجدول الزمني: إعلان المشروع 2023 ← عقد البناء 2025 ← اتفاقية المواد الخام مع سابك 2026 ← أول إنتاج 2027.</div>
<h2>ليش مهم لسوق الخليج؟</h2>
<p>تقريباً كل إطارات سوق الخليج مستوردة. حسب تقديرات Marqstats، انباع حوالي 38.9 مليون تاير في دول مجلس التعاون في 2025، والإطارات الصينية كانت حوالي 41٪ من قيمة السوق. المصنع الجديد بطاقة 3.5 مليون تاير يغطي حوالي 9٪ من طلب المنطقة كلها.</p>
<ul><li><b>سلسلة إمداد أقصر:</b> تاير بيريللي مصنوع في المنطقة نفسها.</li>
<li><b>منافس جديد:</b> البراند السعودي ممكن ينافس الإطارات المستوردة الرخيصة.</li>
<li><b>الأسعار:</b> للحين ما انعلن شي عن الأسعار، لازم ننتظر.</li></ul>
<h2>رأينا</h2>
<p>لعملائنا في عُمان، هذا يعني على الأغلب خيارات أكثر على الرفوف في 2027 و2028. في زاد CSC نتابع أخبار المصنع، وأول ما تنزل منتجاته بنعلن المواصفات والأسعار.</p>
<h2>المصادر</h2>
<ul><li>بيان صندوق الاستثمارات العامة وبيريللي، أكتوبر 2023</li><li>سابك (عبر الاقتصادية وأرقام)، فبراير 2026</li><li>MEED، European Rubber Journal، Adnkronos، Marqstats</li></ul>`},
  en:{t:"Saudi Arabia's first-ever tire: Pirelli's plant starts production in 2027",
      s:"PIF and Pirelli are building a tire plant in King Abdullah Economic City, with raw materials from SABIC and a brand-new Saudi tire brand.",
      b:`<p>Saudi Arabia has never produced a single car tire. That changes in <b>2027</b>. Pirelli's CEO says the first tire the company makes in the Kingdom will be "the first ever produced in the country".</p>
<h2>Who is behind it?</h2>
<ul><li><b>Public Investment Fund (PIF)</b> with a 75% stake.</li>
<li><b>Pirelli</b> with 25%, as technology partner supporting the plant's design, development and operation.</li>
<li>The joint venture, Mena Tyre Company, was announced on 26 October 2023.</li>
<li>Total investment is about <b>$550 million</b> (around SAR 2 billion).</li></ul>
<h2>Where?</h2>
<p>The plant sits in the <b>King Salman Automotive Cluster</b> at <b>King Abdullah Economic City (KAEC)</b>, in Makkah Province on the Red Sea coast — the hub Saudi Arabia is building into the region's car-making centre, alongside the national EV brand Ceer and plants for Lucid and Hyundai.</p>
<p>The construction contract, worth about SAR 628 million ($167 million), went to Saudi Amana in September 2025.</p>
<h2>What will it make?</h2>
<ul><li>Capacity: <b>3.5 million</b> passenger-car tires a year.</li>
<li>Premium tires under the <b>Pirelli</b> brand.</li>
<li>A <b>new Saudi brand</b> for the Saudi and regional markets. Its name hasn't been announced yet.</li></ul>
<h2>Even the raw materials are local</h2>
<p>In February 2026 <b>SABIC</b> signed an agreement to supply the plant with butadiene rubber and carbon black — the first deal of its kind for locally made tire raw materials in the Kingdom.</p>
<h2>Why the delay?</h2>
<p>The original plan was to start production in <b>2026</b>. In February 2026 Pirelli's CEO said first production would come in the second half of 2027, "most probably the third quarter", and in June he spoke of "by mid-2027". In practice, the date has slipped by about a year.</p>
<div class="box">Timeline: project announced 2023 → construction contract 2025 → SABIC raw-materials deal 2026 → first production 2027.</div>
<h2>Why it matters for the Gulf</h2>
<p>Almost every tire sold in the Gulf is imported. Marqstats estimates about 38.9 million tires were sold across the GCC in 2025, with Chinese-made tires taking around 41% of market value. At 3.5 million tires a year, the new plant could cover roughly 9% of regional demand.</p>
<ul><li><b>Shorter supply chain:</b> Pirelli tires made in the region itself.</li>
<li><b>A new competitor:</b> the Saudi brand could take on cheap imports.</li>
<li><b>Prices:</b> nothing has been announced yet — we'll have to wait.</li></ul>
<h2>Our take</h2>
<p>For drivers in Oman this likely means more choice on the shelves in 2027–2028. At Zad CSC we're following the plant closely and will share specs and prices as soon as its tires arrive.</p>
<h2>Sources</h2>
<ul><li>PIF and Pirelli joint announcement, October 2023</li><li>SABIC (via Al Eqtisadiah and Argaam), February 2026</li><li>MEED, European Rubber Journal, Adnkronos, Marqstats</li></ul>`}

<h2>3. مؤشر الحمولة المناسب</h2>
<p>سيارات الدفع الرباعي الثقيلة مثل لاندكروزر ولكزس LX تحتاج إطارات <b>XL</b> أو <b>LT</b> بحمولة كافية.</p>
<div class="box">قِس ضغط الهواء صباحاً والإطار بارد؛ بعد القيادة في الحر ترتفع القراءة طبيعياً فلا تُنقص الهواء.</div>`},
  en:{t:"Choosing tires for Oman's hot asphalt",
      s:"Summer road surfaces can exceed 60°C. Check these points when you buy tires.",
      b:`<p>Extreme road heat raises tire pressure and speeds up tread wear. The right choice improves both safety and cost.</p>
<h2>1. Temperature grade</h2>
<p>Under UTQG, tires are graded <b>A</b>, <b>B</b> or <b>C</b> for heat resistance. <b>A</b> is the highest and the best pick for long drives in Oman.</p>
<h2>2. Treadwear grade</h2>
<p>A higher number means longer tread life under test conditions — better value on long Salalah–Muscat runs.</p>
<h2>3. The right load index</h2>
<p>Heavy SUVs like the Land Cruiser and Lexus LX need <b>XL</b> or <b>LT</b> tires with enough load capacity.</p>
<div class="box">Check pressure in the morning while tires are cold. After driving in the heat the gauge will read higher — that's normal, so don't let air out.</div>`}

      s:"کم کردن باد، سطح تماس تایر را بزرگ‌تر می‌کند و خودرو در شن فرو نمی‌رود. اما قوانینی دارد.",
      b:`<p>در شن نرم، تایر با باد کامل مثل چاقو در شن فرو می‌رود. با کم کردن باد، رد تایر پهن‌تر می‌شود و خودرو روی شن «شناور» می‌ماند.</p>
<h2>قوانین طلایی</h2>
<ul><li>باد را به‌تدریج و با گیج دقیق کم کنید؛ بسیاری از رانندگان باتجربه برای شن نرم حدود ۱۵ تا ۲۰ PSI استفاده می‌کنند، بسته به خودرو و تایر.</li>
<li>با باد کم، آرام برانید و از پیچ‌های تند پرهیز کنید تا تایر از رینگ جدا نشود.</li>
<li><b>پیش از برگشت به آسفالت</b>، باد را به مقدار استاندارد برگردانید؛ رانندگی سریع با باد کم، تایر را داغ و خراب می‌کند.</li>
<li>همیشه پمپ باد ۱۲ ولت و گیج همراه داشته باشید.</li></ul>
<div class="box">تایرهای All-Terrain با دیواره‌ی محکم، برای سفرهای صحرایی ظفار انتخاب مطمئن‌تری هستند.</div>`},
  ar:{t:"ضغط الإطارات للقيادة في الرمال والصحراء",
      s:"تخفيف الهواء يوسّع مساحة تلامس الإطار فلا تغرز السيارة. لكن لذلك قواعد.",
      b:`<p>في الرمل الناعم يغرز الإطار المنفوخ بالكامل، وتخفيف الهواء يجعل الأثر أعرض فتطفو السيارة فوق الرمل.</p>
<h2>القواعد الذهبية</h2>
<ul><li>خفّف الهواء تدريجياً بمقياس دقيق؛ يستخدم كثير من السائقين ذوي الخبرة حوالي 15 إلى 20 PSI للرمل الناعم بحسب السيارة والإطار.</li>
<li>قُد ببطء وتجنّب المنعطفات الحادة كي لا ينفصل الإطار عن الجنط.</li>
<li><b>قبل العودة إلى الأسفلت</b> أعد الضغط إلى القيمة القياسية؛ القيادة السريعة بضغط منخفض تُسخّن الإطار وتتلفه.</li>
<li>احمل دائماً منفاخ 12 فولت ومقياس ضغط.</li></ul>
<div class="box">إطارات All-Terrain ذات الجدار القوي خيار أكثر أماناً لرحلات صحراء ظفار.</div>`},
  en:{t:"Tire pressure for sand and desert driving",
      s:"Airing down enlarges the contact patch so you float instead of sinking. But there are rules.",
      b:`<p>In soft sand a fully inflated tire digs in. Lowering pressure widens the footprint so the vehicle floats on top.</p>
<h2>Golden rules</h2>
<ul><li>Air down gradually with an accurate gauge; many experienced drivers use around 15–20 PSI in soft sand, depending on vehicle and tire.</li>
<li>Drive slowly and avoid sharp turns at low pressure so the tire doesn't unseat from the rim.</li>
<li><b>Before returning to asphalt</b>, re-inflate to the standard pressure — fast driving on low pressure overheats and damages the tire.</li>
<li>Always carry a 12V compressor and a gauge.</li></ul>
<div class="box">All-Terrain tires with strong sidewalls are a safer choice for desert trips in Dhofar.</div>`}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let L = store.get("zad_lang","fa");
let TIRES = [];
let cart = store.get("zad_cart",[]);
const t=k=>(T[L]&&T[L][k])||T.fa[k]||k;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const waURL=msg=>`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
const fmtDate=d=>{try{return new Date(d).toLocaleDateString(L==="fa"?"fa-IR":L==="ar"?"ar-OM":"en-GB",{year:"numeric",month:"long",day:"numeric"})}catch(e){return d}};
const tireSVG=`<svg class="ph" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#151515"/><circle cx="50" cy="50" r="44" fill="none" stroke="#2b2b2b" stroke-width="10" stroke-dasharray="4 5"/><circle cx="50" cy="50" r="24" fill="#cfcfcf"/><circle cx="50" cy="50" r="7" fill="#151515"/><g fill="#9a9a9a">${[0,72,144,216,288].map(a=>`<circle cx="${50+15*Math.cos(a*Math.PI/180)}" cy="${50+15*Math.sin(a*Math.PI/180)}" r="3"/>`).join("")}</g></svg>`;

/* normalise a tire row from API */
function norm(x){
  const arr=v=>Array.isArray(v)?v:(()=>{try{return JSON.parse(v||"[]")}catch(e){return[]}})();
  return {...x, out:x.in_stock===0||x.in_stock==="0", vehicles:arr(x.vehicles), images:arr(x.images), rim:String(x.rim||"").toUpperCase().replace(/^(?!R)/,"R")};
}
function dedupe(list){
  const seen=new Set();
  return list.filter(x=>{const k=[x.brand,x.pattern,x.sizeText,x.width,x.profile,x.rim,x.dotYear].join("|");if(seen.has(k))return false;seen.add(k);return true});
}
async function loadTires(){
  let data=null;
  if(API_URL){
    try{const r=await fetch(API_URL,{cache:"no-store"});if(r.ok){const j=await r.json();if(Array.isArray(j))data=j}}catch(e){}
  }
  TIRES=dedupe((data&&data.length?data:FALLBACK_TIRES).map(norm));
  try{const r=await fetch("/api/oils",{cache:"no-store"});if(r.ok){const j=await r.json();if(Array.isArray(j))OILS=j}}catch(e){}
}

/* i18n apply */
function applyLang(){
  document.documentElement.lang=L;
  document.documentElement.dir=L==="en"?"ltr":"rtl";
  $$("[data-t]").forEach(el=>{const v=t(el.dataset.t); if(el.hasAttribute("data-html"))el.innerHTML=v; else el.textContent=v});
  $$("[data-ph]").forEach(el=>el.placeholder=t(el.dataset.ph));
  $$("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  $$(".waLink").forEach(a=>a.href=waURL(t("wa_hi")));
  document.title = L==="en"?"Zad CSC | Tires, Wheels & Tire-Industry News — Salalah":L==="ar"?"زاد CSC | إطارات وجنوط وأخبار صناعة الإطارات — صلالة":"Zad CSC | تایر، رینگ و اخبار صنعت لاستیک — صلاله";
  buildSelects(); buildUS(); renderAll();
}

/* selects */
const uniq=(k)=>[...new Set(TIRES.map(x=>x[k]).filter(Boolean))].sort((a,b)=>parseFloat(String(a).replace(/\D/g,""))-parseFloat(String(b).replace(/\D/g,"")));
function fillSel(el,vals,label){const cur=el.value;el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join("");if(vals.includes(cur))el.value=cur}
/* all sizes = catalogue + whatever is in stock */
function allSizes(){
  const m=new Map();
  [...SIZES,...TIRES.map(x=>({w:String(x.width),p:String(x.profile),r:x.rim}))].forEach(s=>{if(s.w&&s.p&&s.r)m.set(`${s.w}/${s.p}${s.r}`,s)});
  return [...m.values()];
}
const numSort=a=>[...new Set(a)].sort((x,y)=>parseFloat(String(x).replace(/[^\d.]/g,""))-parseFloat(String(y).replace(/[^\d.]/g,"")));
/* cascading width → profile → rim */
function cascade(wSel,pSel,rSel,lbl){
  const S=allSizes();
  const w=wSel.value,p=pSel.value;
  fillSel(wSel,numSort(S.map(s=>s.w)),lbl[0]);
  const S1=wSel.value?S.filter(s=>s.w==wSel.value):S;
  fillSel(pSel,numSort(S1.map(s=>s.p)),lbl[1]);
  const S2=pSel.value?S1.filter(s=>s.p==pSel.value):S1;
  fillSel(rSel,numSort(S2.map(s=>s.r)),lbl[2]);
}
function buildSelects(){
  cascade($("#hw"),$("#hp"),$("#hr"),["—","—","—"]);
  cascade($("#fw"),$("#fp"),$("#fr"),[t("width"),t("profile"),t("rim")]);
  fillSel($("#fb"),[...new Set([...TIRE_BRANDS.map(b=>b.n),...TIRES.map(x=>x.brand)])].sort(),t("any"));
  fillSel($("#fv"),[...new Set(TIRES.flatMap(x=>x.vehicles))].sort(),t("any"));
  {const el=$("#fc"),cur=el.value,cs=Object.keys(CATS).filter(c=>TIRES.some(x=>x.oeType===c));el.innerHTML=`<option value="">${t("any")}</option>`+cs.map(c=>`<option value="${esc(c)}">${esc(catT(c))}</option>`).join("");el.value=cur}
  updHint();
}
function updHint(){$("#hsz").textContent=`${$("#hw").value||"—"} / ${$("#hp").value||"—"} ${$("#hr").value||"R—"}`}

/* brands, oils, size list */
const inStockBrands=()=>new Set(TIRES.map(x=>x.brand));
const country=c=>{try{return new Intl.DisplayNames([L==="fa"?"fa":L==="ar"?"ar":"en"],{type:"region"}).of(c==="UK"?"GB":c)}catch(e){return c}};
const mono=n=>n.replace(/[^A-Za-z0-9 ]/g,"").split(" ").filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase()||n[0];
function brandTile(b,kind){
  const st=kind==="tire"&&inStockBrands().has(b.n);
  return `<a class="bt${st?" stock":""}" ${kind==="tire"?`data-brand="${esc(b.n)}"`:`target="_blank" rel="noopener" href="${waURL(t("wa_brand")+" "+b.n)}"`}>
    <span class="mono">${esc(mono(b.n))}</span><b>${esc(b.n)}</b><small>${esc(country(b.c))}</small>${st?`<span class="st">${t("in_stock")}</span>`:""}</a>`;
}
function renderBrands(){
  const tb=[...TIRE_BRANDS].sort((a,b)=>inStockBrands().has(b.n)-inStockBrands().has(a.n));
  $("#homeBrands").innerHTML=tb.slice(0,12).map(b=>brandTile(b,"tire")).join("");
  $("#allTireBrands").innerHTML=tb.map(b=>brandTile(b,"tire")).join("");
  const ob=OIL_BRANDS.map(b=>brandTile(b,"oil")).join("");
  $("#oilBrands").innerHTML=ob; $("#allOilBrands").innerHTML=ob;
}
function oilCard(x){
  const img=x.images&&x.images[0]?`<img src="${esc(x.images[0])}" alt="${esc(x.brand)}" loading="lazy" style="object-fit:contain;background:#fff">`:`<svg class="ph" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>`;
  return `<div class="pc"><div class="img" data-open-oil="${x.id}">${img}</div><div class="bd">
    <div class="br">${esc(x.brand)}</div><h3 data-open-oil="${x.id}">${esc(x.name)}</h3><div class="sz">${esc(x.grade||"")}</div>
    ${x.reviews?`<div class="stars">${stars(x.rating)} <small>(${x.reviews} ${t("reviews")})</small></div>`:""}

}
function renderOils(){

  $("#oilGrades").innerHTML=OIL_GRADES.map(s=>`<div class="gsec"><h3>${t("g_"+s.k)}</h3><p class="d">${t("gd_"+s.k)}</p>

}
function renderAllSizes(){
  const stock=new Set(TIRES.filter(x=>!x.out).map(sizeOf));
  const byRim={};allSizes().forEach(s=>{(byRim[s.r]=byRim[s.r]||[]).push(s)});

   +`<div class="rimh">${t("inch")}</div><div class="sizes-all">${INCH_SIZES.map(s=>`<a class="btn" style="padding:5px 9px;font-size:13px;border:1px solid #e0ded6;border-radius:8px;background:#fff" target="_blank" rel="noopener" href="${waURL(t("wa_size")+" "+s)}">${s}</a>`).join("")}</div>`;
}

/* product card */
const desc=x=>x["desc_"+L]||x.desc_en||x.desc_fa||"";
const sizeOf=x=>x.profile&&x.width?`${x.width}/${x.profile}${x.rim}`:(x.sizeText||"");
const CATS={"Passenger / SUV":{fa:"سواری و شاسی‌بلند",ar:"سيارات ودفع رباعي",en:"Passenger / SUV"},"Light truck / Van":{fa:"وانت و ون",ar:"بيك أب وفان",en:"Light truck / Van"},"Off-road":{fa:"آفرود",ar:"طرق وعرة",en:"Off-road"},"Truck & Bus":{fa:"کامیون و اتوبوس",ar:"شاحنات وحافلات",en:"Truck & Bus"},"OTR / Industrial":{fa:"صنعتی و معدنی",ar:"معدات صناعية",en:"OTR / Industrial"}};
const catT=c=>CATS[c]?CATS[c][L]:(c||"");
let SHOWN=48;
function card(x){
  const img=x.images&&x.images[0]?`<img src="${esc(x.images[0])}" alt="${esc(x.brand)}" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(tireSVG))">`:tireSVG;
  return `<div class="pc">
    <div class="img" data-open="${x.id}"${x.out?' style="opacity:.55"':""}>${img}${x.dotYear?`<span class="badge">DOT ${esc(x.dotYear)}</span>`:""}${x.out?`<span class="oos">${t("oos")}</span>`:""}</div>
    <div class="bd">
      <div class="br">${esc(x.brand)}${x.oeType&&CATS[x.oeType]?` · <span style="text-transform:none;font-weight:500">${esc(catT(x.oeType))}</span>`:""}</div>
      <h3 data-open="${x.id}">${esc(x.pattern||x.sizeText)}</h3>
      <div class="sz">${esc(sizeOf(x))}</div>
      ${x.reviews?`<div class="stars">${stars(x.rating)} <small>(${x.reviews} ${t("reviews")})</small></div>`:""}
      ${x.warranty?`<span class="war">${esc(x.warranty)}</span>`:""}
      <div class="act">${x.out?`<a class="btn wa" target="_blank" rel="noopener" href="${waURL(t("wa_oos")+"\n"+x.brand+" "+(x.pattern||"")+" — "+(x.sizeText||sizeOf(x)))}">${t("ask")}</a>`:`<button class="btn y" data-add="${x.id}">+ ${t("add")}</button>`}<button class="btn o" style="color:var(--txt);border-color:#ccc" data-open="${x.id}">${t("details")}</button></div>
    </div></div>`;
}
function filtered(){
  const q=$("#fq").value.trim().toLowerCase(),w=$("#fw").value,p=$("#fp").value,r=$("#fr").value,b=$("#fb").value,v=$("#fv").value,c=$("#fc").value;
  const qn=/^[\d\s\/.rR-]+$/.test(q)?q.replace(/\D/g,""):"";
  return TIRES.filter(x=>(!w||x.width==w)&&(!p||x.profile==p)&&(!r||x.rim==r)&&(!b||x.brand==b)&&(!c||x.oeType==c)&&(!v||x.vehicles.includes(v))&&
    (!q||[x.brand,x.pattern,x.sizeText,sizeOf(x),x.sku,...x.vehicles].join(" ").toLowerCase().includes(q)||(qn.length>=5&&String(x.sizeText||"").replace(/\D/g,"").includes(qn)))).sort((a,b)=>a.out-b.out);
}
function renderTires(keep){

  const list=filtered();

/* router */
function route(){
  const h=location.hash||"#/";
  let p="home",m;
  if(h.startsWith("#/tires")||h.startsWith("#/shop"))p="tires";else if(h.startsWith("#/batteries"))p="batteries";else if(h.startsWith("#/car"))p="car";else if(h.startsWith("#/booking"))p="booking";else if(h.startsWith("#/account"))p="account";else if(h.startsWith("#/oils"))p="oils";else if(h.startsWith("#/brands"))p="brands";else if(h.startsWith("#/services"))p="services";else if(h.startsWith("#/news"))p="news";else if(h.startsWith("#/contact"))p="contact";
  else if(m=h.match(/^#\/article\/(.+)$/)){p="article";renderPost(m[1])}
  else if(m=h.match(/^#\/(tire|oil)\/(\d+)/)){p="item";renderItem(m[1],+m[2])}
  $$(".page").forEach(e=>e.classList.toggle("on",e.id==="p-"+p));
  $$("nav.main a").forEach(a=>a.classList.toggle("on",a.dataset.r===p||(p==="article"&&a.dataset.r==="news")||(a.dataset.r==="shop"&&["tires","oils","batteries","item"].includes(p))));
  $("#nav").classList.remove("open");
  if(p==="account")renderAccount();if(p==="car")initCar();if(p==="booking")initBooking();
  if(p!=="article"&&p!=="item")applyTitle();
  window.scrollTo(0,0);
}
function applyTitle(){document.title = L==="en"?"Zad CSC | Tires, Wheels & Tire-Industry News — Salalah":L==="ar"?"زاد CSC | إطارات وجنوط وأخبار صناعة الإطارات — صلالة":"Zad CSC | تایر، رینگ و اخبار صنعت لاستیک — صلاله"}

const BAT_AH=[35,40,45,50,55,60,65,70,75,80,90,100,110,120,150,200];
const BAT_TYPES=["bt_std","bt_agm","bt_efb","bt_unsure"];
let OILF={t:"",g:"",b:""};
function oilGradesFor(k){const s=OIL_GRADES.filter(x=>!k||x.k===k).flatMap(x=>x.g);return [...new Set([...s,...(!k?OILS.map(o=>o.grade).filter(Boolean):[])])]}
function fillOilSels(tSel,gSel,bSel,v){
  tSel.innerHTML=`<option value="">${t("any")}</option>`+OIL_GRADES.map(x=>`<option value="${x.k}">${esc(t("g_"+x.k))}</option>`).join("");tSel.value=v.t;
  fillSel(gSel,oilGradesFor(v.t),t("any"));gSel.value=v.g;
  fillSel(bSel,[...new Set([...OIL_BRANDS.map(b=>b.n),...OILS.map(o=>o.brand).filter(Boolean)])].sort(),t("any"));bSel.value=v.b;
}
function fillBatSels(aSel,tSel){
  const a=aSel.value,ty=tSel.value;
  aSel.innerHTML=`<option value="">${t("bt_unsure")}</option>`+BAT_AH.map(n=>`<option value="${n}">\u200E${n} Ah</option>`).join("");aSel.value=a;
  tSel.innerHTML=BAT_TYPES.map(k=>`<option value="${k}">${esc(t(k))}</option>`).join("");if(ty)tSel.value=ty;
}
function batMsg(aSel,tSel,cIn){
  const parts=[aSel.value?aSel.value+" Ah":t("us_cap")+": "+t("bt_unsure"),t(tSel.value||"bt_unsure")];
  if(cIn.value.trim())parts.push(cIn.value.trim());
  return t("wa_bat")+" "+parts.join(" — ");
}
function buildUS(){
  if(!$("#uoT"))return;
  fillOilSels($("#uoT"),$("#uoG"),$("#uoB"),OILF);
  fillOilSels($("#ofT"),$("#ofG"),$("#ofB"),OILF);
  fillBatSels($("#ubA"),$("#ubT"));fillBatSels($("#bA"),$("#bT"));
  if(typeof updBat1==="function"){updBat1();updBat2()}
}
function filteredOils(){
  const gs=OILF.g?[OILF.g]:(OILF.t?oilGradesFor(OILF.t):null);
  return OILS.filter(o=>(!gs||gs.some(g=>String(o.grade||o.name||"").toUpperCase().includes(g.toUpperCase())))&&(!OILF.b||String(o.brand||"").toLowerCase().includes(OILF.b.toLowerCase())));
}
const _renderOils=renderOils;
renderOils=function(){
  _renderOils();
  const any=OILF.t||OILF.g||OILF.b, list=filteredOils();
  if($("#oilShop")){$("#oilShop").style.display=list.length?"":"none";$("#oilGrid").innerHTML=list.map(oilCard).join("")}
  const ask=$("#oilAsk");
  if(ask){ask.style.display=any&&!list.length?"":"none";
    $("#oilAskBtn").href=waURL(t("wa_oil_q")+" "+[OILF.g||(OILF.t?t("g_"+OILF.t):""),OILF.b].filter(Boolean).join(" — "));}
};

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zad CSC | تایر، رینگ و مرجع فنی لاستیک در صلاله</title>
<meta name="description" content="زاد CSC صلاله - فروش تایرهای اصلی با ضمانت رسمی، روغن و روانکار، و اخبار و مقالات فنی صنعت لاستیک.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --y:#FFC400; --y2:#FFD84D; --ink:#0E0E0E; --ink2:#1A1A1A; --ink3:#262626;
  --line:#2E2E2E; --mut:#A3A3A3; --bg:#F6F5F1; --card:#FFFFFF; --txt:#151515; --sub:#5C5C5C;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Vazirmatn,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(14,14,14,.94);backdrop-filter:blur(10px);color:#fff;border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:18px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:.3px}
.logo .mark{width:36px;height:36px;border-radius:50%;background:var(--y);display:grid;place-items:center}
.logo .mark svg{width:26px;height:26px}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--mut);margin-top:-6px}
nav.main{display:flex;gap:4px;margin-inline-start:auto}
nav.main a{padding:8px 14px;border-radius:999px;font-weight:500;font-size:15px;color:#ddd}
nav.main a:hover{color:#fff;background:var(--ink3)}
nav.main a.on{background:var(--y);color:var(--ink)}
.hact{display:flex;gap:8px;align-items:center}
.lang{display:flex;background:var(--ink3);border-radius:999px;padding:3px}
.lang button{padding:4px 10px;border-radius:999px;font-size:13px;color:#bbb}
.lang button.on{background:#fff;color:var(--ink)}
.cartbtn{position:relative;width:42px;height:42px;border-radius:50%;background:var(--ink3);display:grid;place-items:center}
.cartbtn svg{width:20px;height:20px}
.cartbtn .n{position:absolute;top:-3px;inset-inline-end:-3px;background:var(--y);color:var(--ink);font-size:11px;font-weight:900;min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.burger{display:none;width:42px;height:42px;border-radius:50%;background:var(--ink3);place-items:center}
@media (max-width:1120px){
  nav.main{position:fixed;inset:66px 0 auto 0;flex-direction:column;background:var(--ink);padding:12px 20px 20px;gap:2px;display:none;border-bottom:1px solid var(--line)}
  nav.main.open{display:flex}
  nav.main a{padding:12px 14px;font-size:16px}
  .burger{display:grid}
  .hact{margin-inline-start:auto}
}

/* hero */
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 38px,rgba(255,196,0,.05) 38px 46px);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:72px}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,196,0,.12);color:var(--y);border:1px solid rgba(255,196,0,.35);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700}
.hero h1{font-size:clamp(30px,4.6vw,52px);line-height:1.25;font-weight:900;margin:18px 0 14px}
.hero h1 em{font-style:normal;color:var(--y)}
.hero p.lead{color:#cfcfcf;font-size:17px;max-width:560px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--y);color:var(--ink)}
.btn.y:hover{background:var(--y2)}
.btn.o{border:1.5px solid #555;color:#fff}
.btn.o:hover{border-color:#fff}
.btn.d{background:var(--ink);color:#fff}
.btn.wa{background:#1FAF55;color:#fff}
.btn svg{width:18px;height:18px}

.finder{background:var(--ink2);border:1px solid var(--line);border-radius:22px;padding:22px}
.finder h3{font-size:17px;margin-bottom:4px}
.finder p{font-size:13px;color:var(--mut);margin-bottom:16px}
.sizerow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;direction:ltr}
.sizerow label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px;text-align:center}
select.s{width:100%;background:var(--ink3);border:1px solid #3a3a3a;color:#fff;border-radius:12px;padding:11px 10px;font-size:16px;font-weight:700;text-align:center;appearance:none}
.sizehint{direction:ltr;text-align:center;font-size:26px;font-weight:900;letter-spacing:1px;margin:14px 0;color:var(--y)}
.finder .btn{width:100%;justify-content:center}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-top:40px;padding-bottom:48px}}

/* sections */
section.blk{padding:64px 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sh h2{font-size:clamp(24px,3vw,32px);font-weight:900;line-height:1.3}
.sh p{color:var(--sub);margin-top:4px}
.sh a.more{font-weight:700;border-bottom:2px solid var(--y)}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cat{background:var(--card);border-radius:var(--r);padding:22px;border:1px solid #e9e7e0;transition:.2s;display:block}
.cat:hover{transform:translateY(-3px);box-shadow:0 12px 30px -16px rgba(0,0,0,.25);border-color:var(--y)}
.cat .ic{width:48px;height:48px;border-radius:14px;background:var(--ink);display:grid;place-items:center;margin-bottom:14px}
.cat .ic svg{width:26px;height:26px;color:var(--y)}
.cat h3{font-size:17px}
.cat p{font-size:14px;color:var(--sub)}
@media (max-width:860px){.cats{grid-template-columns:1fr 1fr}}

.why{background:var(--ink);color:#fff;border-radius:28px;padding:44px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.why .it b{display:block;font-size:30px;font-weight:900;color:var(--y);line-height:1.2}
.why .it span{color:#cfcfcf;font-size:14px}
@media (max-width:860px){.why{grid-template-columns:1fr 1fr;padding:28px}}

/* products */
.shop{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
.filters{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid #e9e7e0;position:sticky;top:84px}
.filters h4{font-size:14px;margin:14px 0 8px;color:var(--sub)}
.filters h4:first-child{margin-top:0}
.fsel{width:100%;border:1px solid #ddd;border-radius:10px;padding:9px 10px;background:#fafafa}
.fin{width:100%;border:1px solid #ddd;border-radius:10px;padding:9px 12px;background:#fafafa}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;direction:ltr}
.reset{margin-top:16px;font-size:14px;font-weight:700;color:var(--sub);text-decoration:underline}
@media (max-width:860px){.shop{grid-template-columns:1fr}.filters{position:static}}
.count{color:var(--sub);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pc{background:var(--card);border-radius:var(--r);border:1px solid #e9e7e0;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.pc:hover{box-shadow:0 14px 34px -18px rgba(0,0,0,.3)}
.pc .img{aspect-ratio:4/3;background:linear-gradient(160deg,#f1efe8,#e5e2d8);display:grid;place-items:center;position:relative;cursor:pointer}
.pc .img img{width:100%;height:100%;object-fit:cover}
.pc .img .ph{width:46%;opacity:.85}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--ink);color:var(--y);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.pc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .br{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px}
.pc h3{font-size:16px;line-height:1.45;cursor:pointer}
.pc .sz{direction:ltr;text-align:start;font-weight:900;font-size:18px}
.stars{color:#E8A400;font-size:13px}
.stars small{color:var(--sub)}
.pc .war{font-size:12px;background:#FFF6D6;color:#7a5a00;padding:4px 9px;border-radius:8px;align-self:flex-start;font-weight:600}
.pc .act{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.pc .act .btn{padding:9px 14px;font-size:14px;flex:1;justify-content:center}
.empty{background:var(--card);border-radius:var(--r);padding:40px;text-align:center;color:var(--sub);border:1px dashed #ccc}

/* product modal + drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none}
.ov.on{display:block}
.modal{position:fixed;z-index:90;inset:auto 0 0 0;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:24px;display:none;max-width:760px;margin:0 auto}
.modal.on{display:block}
@media (min-width:860px){.modal{inset:50% auto auto 50%;transform:translate(-50%,-50%);border-radius:24px;width:760px}}
.x{position:absolute;top:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;background:#f0f0f0;font-size:20px;line-height:1}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:700px){.mgrid{grid-template-columns:1fr}}
.spec{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.spec td{padding:7px 0;border-bottom:1px solid #eee;vertical-align:top}
.spec td:first-child{color:var(--sub);width:42%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#f1f1f1;border-radius:999px;padding:3px 10px;font-size:13px}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--card);z-index:90;transform:translateX(110%);transition:.25s;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-110%)}
.drawer.on{transform:none!important}
.drawer .hd{padding:20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.drawer .ls{flex:1;overflow:auto;padding:12px 20px}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0;align-items:center}
.ci .t{flex:1;font-size:14px}
.ci .t b{display:block;direction:ltr;text-align:start}
.qty{display:flex;align-items:center;border:1px solid #ddd;border-radius:999px}
.qty button{width:30px;height:30px;font-size:16px}
.qty span{min-width:22px;text-align:center;font-weight:700}
.drawer .ft{padding:20px;border-top:1px solid #eee}
.drawer .ft .btn{width:100%;justify-content:center}
.drawer .note{font-size:12px;color:var(--sub);margin-top:8px;text-align:center}

/* articles */
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.arts{grid-template-columns:1fr}}
.ac{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid #e9e7e0;display:flex;flex-direction:column;transition:.2s}
.ac:hover{transform:translateY(-3px);box-shadow:0 14px 34px -18px rgba(0,0,0,.3)}
.ac .cv{aspect-ratio:16/9;display:grid;place-items:center;position:relative;overflow:hidden}
.ac .cv svg{width:42%;opacity:.95}
.ac .bd{padding:16px 18px 20px}
.ac .meta{font-size:12px;color:var(--sub);display:flex;gap:10px;align-items:center}
.ac .kind{background:var(--ink);color:var(--y);padding:2px 9px;border-radius:999px;font-weight:700}
.ac h3{font-size:18px;line-height:1.5;margin:8px 0 6px}
.ac p{font-size:14px;color:var(--sub)}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid #e0ded6;font-weight:600;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
article.post{max-width:760px;margin:0 auto;background:var(--card);border-radius:24px;padding:clamp(22px,5vw,48px);border:1px solid #e9e7e0}
article.post h1{font-size:clamp(24px,3.4vw,34px);line-height:1.4;margin:12px 0 8px;font-weight:900}
article.post .meta{color:var(--sub);font-size:14px;margin-bottom:22px}
article.post h2{font-size:21px;margin:26px 0 8px}
article.post p,article.post li{font-size:16.5px;color:#2a2a2a;margin-bottom:12px}
article.post ul{padding-inline-start:22px}
article.post .box{background:#FFF6D6;border-inline-start:4px solid var(--y);padding:14px 16px;border-radius:10px;margin:18px 0}
article.post .ltr{direction:ltr;display:inline-block;font-weight:700}
.back{display:inline-flex;gap:6px;font-weight:700;margin-bottom:18px}

/* contact */
.ct{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.ct{grid-template-columns:1fr}}
.cbox{background:var(--card);border-radius:var(--r);padding:26px;border:1px solid #e9e7e0}
.crow{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #f0f0f0}
.crow:last-child{border:0}
.crow .ic{width:44px;height:44px;border-radius:12px;background:var(--ink);display:grid;place-items:center;flex-shrink:0}
.crow .ic svg{width:20px;height:20px;color:var(--y)}
.crow small{display:block;color:var(--sub);font-size:12px}
.crow b{direction:ltr;display:inline-block}
.map{border-radius:var(--r);overflow:hidden;min-height:320px;border:1px solid #e9e7e0}
.map iframe{width:100%;height:100%;min-height:320px;border:0}

footer{background:var(--ink);color:#bbb;padding:44px 0 26px;margin-top:40px}
footer .fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}
footer h5{color:#fff;font-size:15px;margin-bottom:10px}
footer a{display:block;padding:3px 0;font-size:14px}
footer a:hover{color:var(--y)}
footer .cp{border-top:1px solid var(--line);margin-top:28px;padding-top:18px;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:860px){footer .fg{grid-template-columns:1fr}}

.fab{position:fixed;bottom:20px;inset-inline-start:20px;z-index:40;width:56px;height:56px;border-radius:50%;background:#1FAF55;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
.fab svg{width:28px;height:28px;color:#fff}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:100;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.page{display:none}
.page.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pagehead{background:var(--ink);color:#fff;padding:44px 0}
.pagehead h1{font-size:clamp(26px,3.6vw,38px);font-weight:900}
.pagehead p{color:#cfcfcf}

/* brands & oils */
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bt{background:var(--card);border:1px solid #e9e7e0;border-radius:14px;padding:16px 12px;text-align:center;transition:.2s;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.bt:hover{border-color:var(--y);transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(0,0,0,.3)}
.bt .mono{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center;font-weight:900;font-size:20px;letter-spacing:-.5px;direction:ltr}
.bt b{font-size:15px;direction:ltr;letter-spacing:.3px}
.bt small{font-size:12px;color:var(--sub)}
.bt.stock{border-color:var(--y);background:#FFFBEB}
.bt .st{font-size:10px;background:var(--y);color:var(--ink);border-radius:999px;padding:1px 8px;font-weight:700}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.gr{background:var(--card);border:1px solid #e9e7e0;border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:.2s}
.gr:hover{border-color:var(--y);background:#FFFBEB}
.gr b{display:block;direction:ltr;font-size:19px;font-weight:900}
.gr small{color:var(--sub);font-size:12px}
.gsec{margin-bottom:34px}
.gsec h3{font-size:19px;margin-bottom:4px}
.gsec p.d{color:var(--sub);font-size:14px;margin-bottom:14px}
.info{background:var(--ink);color:#e8e8e8;border-radius:20px;padding:26px;margin-bottom:34px}
.info h3{color:var(--y);margin-bottom:8px}
.info p{font-size:15px}
.info .ltr{direction:ltr;display:inline-block;font-weight:700;color:#fff}
.sizes-all{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.sizes-all button{background:var(--card);border:1px solid #e0ded6;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600}
.sizes-all button:hover{border-color:var(--y);background:#FFFBEB}
.sizes-all button.in{background:var(--y);border-color:var(--y)}
.rimh{font-weight:900;font-size:15px;margin:14px 0 6px;direction:ltr;text-align:start}
.note2{font-size:13px;color:var(--sub);margin-top:14px}
/* forms & account */
.box2{background:var(--card);border:1px solid #e9e7e0;border-radius:var(--r);padding:22px;margin-bottom:18px}
.box2 h3{font-size:18px;margin-bottom:12px}
.fg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.fld label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px 12px;background:#fafafa}
.fld textarea{min-height:70px}
.ltrin{direction:ltr;text-align:left}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:14px;display:none}
.msg.ok{display:block;background:#E8F7EE;color:#14632f}
.msg.err{display:block;background:#FDECEC;color:#8a1c1c}
.vinbox{display:flex;gap:8px;flex-wrap:wrap}
.vinbox input{flex:1;min-width:220px;font-size:18px;font-weight:700;letter-spacing:1px;direction:ltr;text-transform:uppercase;border:2px solid var(--ink);border-radius:12px;padding:12px 14px}
.car-res{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
@media (max-width:760px){.car-res{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--sub)}
.kv dd{font-weight:700;direction:ltr;text-align:start}
.chipbtn{display:inline-block;margin:4px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--ink);font-weight:700;direction:ltr;cursor:pointer;background:#fff}
.chipbtn:hover{background:var(--y);border-color:var(--y)}
.tabs2{display:flex;gap:6px;margin-bottom:16px}
.tabs2 button{padding:8px 16px;border-radius:999px;border:1px solid #ddd;background:#fff;font-weight:700}
.tabs2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table.lst{width:100%;border-collapse:collapse;font-size:14px}
table.lst th,table.lst td{padding:8px 6px;border-bottom:1px solid #eee;text-align:start;vertical-align:top}
table.lst th{color:var(--sub);font-weight:600;font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eee}
.pill.new{background:#FFF1C2}.pill.confirmed,.pill.processing{background:#DCEBFF}.pill.done,.pill.delivered{background:#DDF5E4}.pill.cancelled{background:#F5DADA}
.due{background:#FFF6D6;border-inline-start:4px solid var(--y);padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:14px}
.empty2{color:var(--sub);font-size:14px;padding:8px 0}
.disclaim{font-size:12px;color:var(--sub);margin-top:10px}
</style>
</head>
<body>

<header>

/* normalise a tire row from API */
function norm(x){
  const arr=v=>Array.isArray(v)?v:(()=>{try{return JSON.parse(v||"[]")}catch(e){return[]}})();
  return {...x, vehicles:arr(x.vehicles), images:arr(x.images), rim:String(x.rim||"").toUpperCase().replace(/^(?!R)/,"R")};
}
function dedupe(list){
  const seen=new Set();
  return list.filter(x=>{const k=[x.brand,x.pattern,x.width,x.profile,x.rim].join("|");if(seen.has(k))return false;seen.add(k);return true});
}
async function loadTires(){
  let data=null;
  if(API_URL){
    try{const r=await fetch(API_URL,{cache:"no-store"});if(r.ok){const j=await r.json();if(Array.isArray(j))data=j}}catch(e){}
  }
  TIRES=dedupe((data&&data.length?data:FALLBACK_TIRES).map(norm));
}

}

const uniq=(k)=>[...new Set(TIRES.map(x=>x[k]).filter(Boolean))].sort((a,b)=>parseFloat(String(a).replace(/\D/g,""))-parseFloat(String(b).replace(/\D/g,"")));
function fillSel(el,vals,label){const cur=el.value;el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join("");if(vals.includes(cur))el.value=cur}
/* all sizes = catalogue + whatever is in stock */
function allSizes(){
  const m=new Map();
  [...SIZES,...TIRES.map(x=>({w:String(x.width),p:String(x.profile),r:x.rim}))].forEach(s=>{if(s.w&&s.p&&s.r)m.set(`${s.w}/${s.p}${s.r}`,s)});
  return [...m.values()];
}
const numSort=a=>[...new Set(a)].sort((x,y)=>parseFloat(String(x).replace(/[^\d.]/g,""))-parseFloat(String(y).replace(/[^\d.]/g,"")));
/* cascading width → profile → rim */
function cascade(wSel,pSel,rSel,lbl){
  const S=allSizes();
  const w=wSel.value,p=pSel.value;
  fillSel(wSel,numSort(S.map(s=>s.w)),lbl[0]);
  const S1=wSel.value?S.filter(s=>s.w==wSel.value):S;
  fillSel(pSel,numSort(S1.map(s=>s.p)),lbl[1]);
  const S2=pSel.value?S1.filter(s=>s.p==pSel.value):S1;
  fillSel(rSel,numSort(S2.map(s=>s.r)),lbl[2]);
}
function buildSelects(){
  cascade($("#hw"),$("#hp"),$("#hr"),["—","—","—"]);
  cascade($("#fw"),$("#fp"),$("#fr"),[t("width"),t("profile"),t("rim")]);
  fillSel($("#fb"),[...new Set([...TIRE_BRANDS.map(b=>b.n),...TIRES.map(x=>x.brand)])].sort(),t("any"));
  fillSel($("#fv"),[...new Set(TIRES.flatMap(x=>x.vehicles))].sort(),t("any"));
  updHint();
}
function updHint(){$("#hsz").textContent=`${$("#hw").value||"—"} / ${$("#hp").value||"—"} ${$("#hr").value||"R—"}`}

/* brands, oils, size list */
const inStockBrands=()=>new Set(TIRES.map(x=>x.brand));
const country=c=>{try{return new Intl.DisplayNames([L==="fa"?"fa":L==="ar"?"ar":"en"],{type:"region"}).of(c==="UK"?"GB":c)}catch(e){return c}};
const mono=n=>n.replace(/[^A-Za-z0-9 ]/g,"").split(" ").filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase()||n[0];
function brandTile(b,kind){
  const st=kind==="tire"&&inStockBrands().has(b.n);
  return `<a class="bt${st?" stock":""}" ${kind==="tire"?`data-brand="${esc(b.n)}"`:`target="_blank" rel="noopener" href="${waURL(t("wa_brand")+" "+b.n)}"`}>
    <span class="mono">${esc(mono(b.n))}</span><b>${esc(b.n)}</b><small>${esc(country(b.c))}</small>${st?`<span class="st">${t("in_stock")}</span>`:""}</a>`;
}
function renderBrands(){
  const tb=[...TIRE_BRANDS].sort((a,b)=>inStockBrands().has(b.n)-inStockBrands().has(a.n));
  $("#homeBrands").innerHTML=tb.slice(0,12).map(b=>brandTile(b,"tire")).join("");
  $("#allTireBrands").innerHTML=tb.map(b=>brandTile(b,"tire")).join("");
  const ob=OIL_BRANDS.map(b=>brandTile(b,"oil")).join("");
  $("#oilBrands").innerHTML=ob; $("#allOilBrands").innerHTML=ob;
}
function renderOils(){
  $("#oilGrades").innerHTML=OIL_GRADES.map(s=>`<div class="gsec"><h3>${t("g_"+s.k)}</h3><p class="d">${t("gd_"+s.k)}</p>
    <div class="grades">${s.g.map(g=>`<a class="gr" target="_blank" rel="noopener" href="${waURL(t("wa_oil")+" "+g+" ("+t("g_"+s.k)+")")}"><b>${esc(g)}</b><small>${t("ask")}</small></a>`).join("")}</div></div>`).join("");
}
function renderAllSizes(){
  const stock=new Set(TIRES.map(sizeOf));
  const byRim={};allSizes().forEach(s=>{(byRim[s.r]=byRim[s.r]||[]).push(s)});
  const rims=numSort(Object.keys(byRim));
  $("#allSizes").innerHTML=rims.map(r=>`<div class="rimh">${r}</div><div class="sizes-all">${numSort(byRim[r].map(s=>s.w+"/"+s.p)).map(wp=>{const lab=wp+r;return `<button class="${stock.has(lab)?"in":""}" data-size="${lab}">${lab}</button>`}).join("")}</div>`).join("")
   +`<div class="rimh">${t("inch")}</div><div class="sizes-all">${INCH_SIZES.map(s=>`<a class="btn" style="padding:5px 9px;font-size:13px;border:1px solid #e0ded6;border-radius:8px;background:#fff" target="_blank" rel="noopener" href="${waURL(t("wa_size")+" "+s)}">${s}</a>`).join("")}</div>`;
}

/* product card */
const desc=x=>x["desc_"+L]||x.desc_en||x.desc_fa||"";
const sizeOf=x=>`${x.width}/${x.profile}${x.rim}`;
function card(x){
  const img=x.images&&x.images[0]?`<img src="${esc(x.images[0])}" alt="${esc(x.brand)}" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(tireSVG))">`:tireSVG;
  return `<div class="pc">
    <div class="img" data-open="${x.id}">${img}${x.dotYear?`<span class="badge">DOT ${esc(x.dotYear)}</span>`:""}</div>
    <div class="bd">
      <div class="br">${esc(x.brand)}</div>
      <h3 data-open="${x.id}">${esc(x.pattern||x.sizeText)}</h3>
      <div class="sz">${esc(sizeOf(x))}</div>
      <div class="stars">${"★".repeat(Math.round(x.rating||5))} <small>(${x.reviews||0} ${t("reviews")})</small></div>
      ${x.warranty?`<span class="war">${esc(x.warranty)}</span>`:""}
      <div class="act"><button class="btn y" data-add="${x.id}">+ ${t("add")}</button><button class="btn o" style="color:var(--txt);border-color:#ccc" data-open="${x.id}">${t("details")}</button></div>
    </div></div>`;
}
function filtered(){
  const q=$("#fq").value.trim().toLowerCase(),w=$("#fw").value,p=$("#fp").value,r=$("#fr").value,b=$("#fb").value,v=$("#fv").value;
  return TIRES.filter(x=>(!w||x.width==w)&&(!p||x.profile==p)&&(!r||x.rim==r)&&(!b||x.brand==b)&&(!v||x.vehicles.includes(v))&&
    (!q||[x.brand,x.pattern,x.sizeText,sizeOf(x),...x.vehicles].join(" ").toLowerCase().includes(q)));
}
function renderTires(){
  const list=filtered();
  $("#fcount").textContent = L==="en"?`${list.length} ${t("found")}`:`${list.length} ${t("found")}`;
  const w=$("#fw").value,p=$("#fp").value,r=$("#fr").value,b=$("#fb").value;
  const want=[b,(w||p||r)?`${w||"?"}/${p||"?"}${r||""}`:""].filter(Boolean).join(" ");
  $("#tireGrid").innerHTML = list.length?list.map(card).join(""):`<div class="empty" style="grid-column:1/-1">${want?`<b style="direction:ltr;display:block;font-size:22px;color:var(--txt)">${esc(want)}</b>${t("sz_none")}`:t("none")}<br><br><a class="btn wa" target="_blank" rel="noopener" href="${waURL((want?t("wa_size")+" "+want:t("wa_hi")))}">${want?t("ask_size"):"WhatsApp"}</a></div>`;
}
function artCard(a){
  const c=a[L]||a.en;
  return `<a class="ac" href="#/article/${a.slug}">
    <div class="cv" style="background:${a.color}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#FFC400" stroke-width="9" stroke-dasharray="5 4"/><circle cx="50" cy="50" r="18" fill="none" stroke="#fff" stroke-width="3"/></svg></div>
    <div class="bd"><div class="meta"><span class="kind">${t("kind_"+a.kind)}</span><span>${fmtDate(a.date)}</span></div>
    <h3>${esc(c.t)}</h3><p>${esc(c.s)}</p></div></a>`;
}
let ntab="all";
function renderNews(){
  const list=[...ARTICLES].sort((a,b)=>b.date.localeCompare(a.date));
  $("#homeArts").innerHTML=list.slice(0,3).map(artCard).join("");
  const fl=list.filter(a=>ntab==="all"||a.kind===ntab);
  $("#newsGrid").innerHTML=fl.length?fl.map(artCard).join(""):`<div class="empty" style="grid-column:1/-1">—</div>`;
}
function renderPost(slug){
  const a=ARTICLES.find(x=>x.slug===slug); if(!a){location.hash="#/news";return}
  const c=a[L]||a.en;
  $("#post").innerHTML=`<span class="kind" style="background:var(--ink);color:var(--y);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700">${t("kind_"+a.kind)}</span>
  <h1>${esc(c.t)}</h1><div class="meta">${fmtDate(a.date)} · ${a.min} ${t("min")}</div>${c.b}
  <div style="margin-top:28px"><a class="btn wa" target="_blank" rel="noopener" href="${waURL(t("wa_hi"))}">${t("hero_cta2")}</a></div>`;
  document.title=c.t+" | Zad CSC";
}
function renderServices(){
  const ic=['<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/>','<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>','<path d="M3 17l4-8 4 5 3-3 7 6"/><path d="M3 21h18"/>','<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>'];
  $("#svcGrid").innerHTML=[1,2,3,4].map(i=>`<div class="cat"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ic[i-1]}</svg></div><h3>${t("s"+i)}</h3><p>${t("s"+i+"p")}</p></div>`).join("");
}
function renderAll(){
  $("#featGrid").innerHTML=TIRES.slice(0,4).map(card).join("")||`<div class="empty">${t("none")}</div>`;
  renderTires(); renderNews(); renderServices(); renderCart(); renderBrands(); renderOils(); renderAllSizes();
  const m=location.hash.match(/^#\/article\/(.+)$/); if(m)renderPost(m[1]);
}

/* modal */
function openTire(id){
  const x=TIRES.find(y=>y.id==id); if(!x)return;
  const img=x.images&&x.images[0]?`<img src="${esc(x.images[0])}" style="width:100%;border-radius:14px" onerror="this.outerHTML=tireSVG">`:`<div style="background:linear-gradient(160deg,#f1efe8,#e5e2d8);border-radius:14px;aspect-ratio:1;display:grid;place-items:center">${tireSVG}</div>`;
  $("#modal").innerHTML=`<button class="x" id="mx">×</button><div class="mgrid"><div>${img}</div><div>
    <div class="br" style="font-size:12px;font-weight:700;color:var(--sub)">${esc(x.brand)}</div>
    <h2 style="font-size:22px;line-height:1.4">${esc(x.pattern||"")}</h2>
    <div class="sz" style="direction:ltr;text-align:start;font-size:22px;font-weight:900">${esc(x.sizeText||sizeOf(x))}</div>
    <p style="color:var(--sub);margin:8px 0">${esc(desc(x))}</p>
    <table class="spec">
      ${x.warranty?`<tr><td>${t("warranty")}</td><td>${esc(x.warranty)}</td></tr>`:""}
      ${x.dotYear?`<tr><td>${t("dot")}</td><td>${esc(x.dotYear)}</td></tr>`:""}
      ${x.utqg?`<tr><td>${t("load")}</td><td>${esc(x.utqg)}</td></tr>`:""}
      ${x.oeType?`<tr><td>${t("fit")}</td><td>${esc(x.oeType)}</td></tr>`:""}
    </table>
    ${x.vehicles.length?`<div style="margin-top:12px;font-size:14px;color:var(--sub)">${t("fits")}</div><div class="chips">${x.vehicles.map(v=>`<span class="chip">${esc(v)}</span>`).join("")}</div>`:""}
    <div class="btns" style="margin-top:18px"><button class="btn y" data-add="${x.id}">+ ${t("add")}</button><a class="btn wa" target="_blank" rel="noopener" href="${waURL(t("wa_ask")+"\n"+(x.sizeText||sizeOf(x)))}">${t("ask")}</a></div>
  </div></div>`;
  $("#modal").classList.add("on");$("#ov").classList.add("on");
}
function closeAll(){$("#modal").classList.remove("on");$("#drawer").classList.remove("on");$("#ov").classList.remove("on")}

/* cart */
function saveCart(){store.set("zad_cart",cart);renderCart()}
function addCart(id){const c=cart.find(z=>z.id==id);if(c)c.q++;else cart.push({id:+id,q:4});saveCart();toast(t("added"))}
function renderCart(){
  cart=cart.filter(c=>TIRES.some(x=>x.id==c.id)&&c.q>0);
  $("#cartN").textContent=cart.reduce((s,c)=>s+c.q,0);
  $("#cartList").innerHTML=cart.length?cart.map(c=>{const x=TIRES.find(y=>y.id==c.id);return `<div class="ci"><div class="t">${esc(x.brand)} ${esc(x.pattern||"")}<b>${esc(sizeOf(x))}</b></div><div class="qty"><button data-q="${c.id}" data-d="-1">−</button><span>${c.q}</span><button data-q="${c.id}" data-d="1">+</button></div></div>`}).join(""):`<p style="color:var(--sub);padding:20px 0">${t("cart_empty")}</p>`;
  $("#cartSend").disabled=!cart.length;$("#cartSend").style.opacity=cart.length?1:.5;
}
function sendCart(){
  if(!cart.length)return;
  const lines=cart.map(c=>{const x=TIRES.find(y=>y.id==c.id);return `• ${x.brand} ${x.pattern||""} — ${x.sizeText||sizeOf(x)} × ${c.q} ${t("qty")}`});
  const items=cart.map(c=>{const x=TIRES.find(y=>y.id==c.id);return {id:x.id,name:x.brand+" "+(x.pattern||""),size:x.sizeText||sizeOf(x),qty:c.q}});
  const w=window.open("about:blank","_blank");
  fetch("/api/orders",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({items})}).then(r=>r.json()).catch(()=>({})).then(j=>{
    const msg=t("wa_cart")+(j&&j.id?` (#${j.id})`:"")+"\n"+lines.join("\n");
    if(w)w.location.href=waURL(msg);else window.open(waURL(msg),"_blank");
  });
}
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1800)}

/* router */
function route(){
  const h=location.hash||"#/";
  let p="home",m;
  if(h.startsWith("#/tires"))p="tires";else if(h.startsWith("#/car"))p="car";else if(h.startsWith("#/booking"))p="booking";else if(h.startsWith("#/account"))p="account";else if(h.startsWith("#/oils"))p="oils";else if(h.startsWith("#/brands"))p="brands";else if(h.startsWith("#/services"))p="services";else if(h.startsWith("#/news"))p="news";else if(h.startsWith("#/contact"))p="contact";
  else if(m=h.match(/^#\/article\/(.+)$/)){p="article";renderPost(m[1])}
  $$(".page").forEach(e=>e.classList.toggle("on",e.id==="p-"+p));
  $$("nav.main a").forEach(a=>a.classList.toggle("on",a.dataset.r===p||(p==="article"&&a.dataset.r==="news")));
  $("#nav").classList.remove("open");
  if(p==="account")renderAccount();if(p==="car")initCar();if(p==="booking")initBooking();
  if(p!=="article")applyTitle();
  window.scrollTo(0,0);
}
function applyTitle(){document.title = L==="en"?"Zad CSC | Tires, Wheels & Tire-Industry News — Salalah":L==="ar"?"زاد CSC | إطارات وجنوط وأخبار صناعة الإطارات — صلالة":"Zad CSC | تایر، رینگ و اخبار صنعت لاستیک — صلاله"}

/* events */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-add]");if(a){addCart(a.dataset.add);return}
  const o=e.target.closest("[data-open]");if(o){openTire(o.dataset.open);return}
  const q=e.target.closest("[data-q]");if(q){const c=cart.find(z=>z.id==q.dataset.q);c.q+=+q.dataset.d;saveCart();return}
  const sz=e.target.closest("[data-size]");if(sz){const m=sz.dataset.size.match(/^(\d+)\/(\d+)(R\d+)$/);if(m){["#fq","#fb","#fv"].forEach(s=>$(s).value="");setFilterSize(m[1],m[2],m[3]);renderTires();window.scrollTo({top:0,behavior:"smooth"})}return}
  const br=e.target.closest("[data-brand]");if(br){["#fq","#fw","#fp","#fr","#fv"].forEach(s=>$(s).value="");buildSelects();$("#fb").value=br.dataset.brand;location.hash="#/tires";setTimeout(renderTires,0);return}
  if(e.target.id==="mx")closeAll();
});
$("#ov").onclick=closeAll;
$("#cartOpen").onclick=()=>{renderCart();$("#drawer").classList.add("on");$("#ov").classList.add("on")};
$("#cartClose").onclick=closeAll;
$("#cartSend").onclick=sendCart;
$("#burger").onclick=()=>$("#nav").classList.toggle("open");
$$("#lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;store.set("zad_lang",L);applyLang()});
["#hw","#hp","#hr"].forEach(s=>$(s).onchange=()=>{if(s!=="#hr")cascade($("#hw"),$("#hp"),$("#hr"),["—","—","—"]);updHint()});
["#fw","#fp"].forEach(s=>$(s).addEventListener("change",()=>{cascade($("#fw"),$("#fp"),$("#fr"),[t("width"),t("profile"),t("rim")]);renderTires()}));
function setFilterSize(w,p,r){const L3=[t("width"),t("profile"),t("rim")];$("#fw").value=w;cascade($("#fw"),$("#fp"),$("#fr"),L3);$("#fp").value=p;cascade($("#fw"),$("#fp"),$("#fr"),L3);$("#fr").value=r}
$("#hgo").onclick=()=>{setFilterSize($("#hw").value,$("#hp").value,$("#hr").value);$("#fq").value="";$("#fb").value="";$("#fv").value="";location.hash="#/tires";renderTires()};
["#fq","#fw","#fp","#fr","#fb","#fv"].forEach(s=>$(s).addEventListener("input",renderTires));
$("#freset").onclick=()=>{["#fq","#fw","#fp","#fr","#fb","#fv"].forEach(s=>$(s).value="");buildSelects();renderTires()};
$$("#ntabs button").forEach(b=>b.onclick=()=>{ntab=b.dataset.k;$$("#ntabs button").forEach(x=>x.classList.toggle("on",x===b));renderNews()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
window.addEventListener("hashchange",route);
$("#yr").textContent=new Date().getFullYear();

(async()=>{await loadTires();applyLang();route()})();
</script>
<script src="/app2.js"></script>
</body>
</html>
